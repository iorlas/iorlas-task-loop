[project]
name = "iorlas-task-loop"
version = "0"
description = "Task loop engine: the dependencies of tl.py (PEP 723 header, same pin) and the dev and test tooling."
requires-python = ">=3.15"
dependencies = [
    "msgspec==0.22.0",
]

[dependency-groups]
dev = ["pytest", "pytest-xdist"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Plain classes, any name: tests/conftest.py collects only the classes a module defines
python_classes = ["*"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
# maxschedchunk: xdist hands out at most 4 tests at a time, so the slow modules (test_release, land) spread over the workers: 2x faster than the default
# -m: the default run is the logic kind only; `just test` (dev/runtests.py: -m "not serial", then -m serial), `just test-full` and any -m of yours run real and e2e
addopts = "-p no:cacheprovider --maxschedchunk=4 -m 'not real and not e2e'"
markers = [
    "serial: runs alone, after the parallel workers (tests/conftest.py SERIAL)",
    "live: a scenario that runs the real pieces (git remote, processes, dashboard); only `just test-live` / `pytest -m live` collects tests/live",
    "real: real git, processes or sockets; set by a real/ folder, or by @real_proc(reason) / @real_git(reason) on one test (tests/conftest.py)",
    "e2e: a whole flow (tests/e2e/); set by the folder",
    "needs(capability, reason): one test needs a capability a logic test lacks (process, git, real_clock, long_run, network, thread_race); folds into real (tests/support/procsim.py)",
    "real_proc(reason): one test starts real processes; folds into real (tests/support/procsim.py)",
]
