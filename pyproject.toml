[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "iorlas-task-loop"
version = "0"
description = "Minimal task-loop successor foundation"
requires-python = ">=3.15"
dependencies = [
    "any-agent==0.7.0",
    "beads-client==0.2.0",
    "git-porcelain==0.18.1",
    "process-lock==0.2.1",
    "pydantic==2.14.3",
    "sqlite-store==0.1.0",
    "stream-proc==0.7.0",
]

[tool.uv.sources]
any-agent = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/any-agent", tag = "any-agent-v0.7.0" }
sqlite-store = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/sqlite-store", tag = "sqlite-store-v0.1.0" }
git-porcelain = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/git-porcelain", tag = "git-porcelain-v0.18.1" }
process-lock = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/process-lock", tag = "process-lock-v0.2.1" }
beads-client = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/beads-client", tag = "beads-client-v0.2.0" }
# Same tag and commit as any-agent's own stream-proc: the two must come from one shelf commit.
stream-proc = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/stream-proc", tag = "any-agent-v0.7.0" }

[project.scripts]
tl = "taskloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskloop"]

[tool.hatch.build.targets.sdist]
include = ["src/taskloop", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-xdist==3.8.0"]

[tool.shelf-size]
code-file = 400
function = 80
test-file = 800

[tool.pytest.ini_options]
testpaths = ["tests/cli", "tests/steps", "tests/rules"]
addopts = "--import-mode=importlib -p no:cacheprovider"
# importlib mode puts no test directory on sys.path: tests import the shared doubles module (tests/steps/doubles.py)
pythonpath = ["tests/steps"]
