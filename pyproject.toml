[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "iorlas-task-loop"
version = "0"
description = "Minimal task-loop successor foundation"
requires-python = ">=3.15"
dependencies = ["beads-client==0.1.0", "git-porcelain==0.13.0"]

[tool.uv.sources]
git-porcelain = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/git-porcelain", tag = "git-porcelain-v0.13.0" }
beads-client = { git = "https://github.com/yoselabs/shelf.git", subdirectory = "packages/beads-client", tag = "beads-client-v0.1.0" }

[project.scripts]
tl = "taskloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskloop"]

[tool.hatch.build.targets.sdist]
include = ["src/taskloop", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-xdist==3.8.0"]

[tool.shelf-size]
code-file = 400
function = 80
test-file = 800

[tool.pytest.ini_options]
testpaths = ["tests/cli", "tests/rules"]
addopts = "--import-mode=importlib -p no:cacheprovider"
