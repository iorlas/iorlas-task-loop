[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "iorlas-task-loop"
version = "0"
description = "Minimal task-loop successor foundation"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
tl = "taskloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskloop"]

[tool.hatch.build.targets.sdist]
include = ["src/taskloop", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-xdist==3.8.0"]

[tool.shelf-size]
code-file = 400
function = 80
test-file = 800

[tool.pytest.ini_options]
testpaths = ["tests/cli", "tests/rules"]
addopts = "--import-mode=importlib -p no:cacheprovider"
