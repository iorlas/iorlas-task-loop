[project]
name = "tldelegate"
version = "0"
description = "Delegate worker routing and account supervision."
requires-python = ">=3.15"
dependencies = []

[tool.uv.sources]
tltestkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delegate"]

[dependency-groups]
dev = ["pytest", "tltestkit", "pytest-xdist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*"]
addopts = "-p no:cacheprovider"
# Vendored shelf packages have no manifest (docs/design/workspace.md section 4).
pythonpath = ["src", "tests", "../../skills/task-loop/_vendor"]
