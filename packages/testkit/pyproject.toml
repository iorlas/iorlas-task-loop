[project]
name = "tltestkit"
version = "0"
description = "The test kit every package inherits: the layer of a test by its path and the limits of each layer (stage-packages.md section 3)."
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tltestkit"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
