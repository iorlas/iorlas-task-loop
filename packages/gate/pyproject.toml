[project]
name = "tlgate"
version = "0"
description = "Gate execution and check domain rules. Imports only the kernel."
requires-python = ">=3.15"
dependencies = ["tlkernel", "tltestkit"]

[tool.uv.sources]
tlkernel = { workspace = true }
tltestkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlgate"]

[dependency-groups]
dev = ["pytest", "tltestkit", "msgspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*"]
addopts = "-p no:cacheprovider"
# atomic_io is a vendored shelf directory with no manifest, so it cannot be declared: the vendor dir is the one undeclared path (docs/design/workspace.md section 4)
pythonpath = ["src", "../../skills/task-loop/_vendor"]
