[project]
name = "tldash"
version = "0"
description = "Dashboard server, views and static assets. Imports only the kernel."
requires-python = ">=3.15"
dependencies = ["tlkernel", "tldelegate"]

[tool.uv.sources]
tlkernel = { workspace = true }
tldelegate = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tldash"]

[dependency-groups]
dev = ["pytest", "tltestkit", "msgspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*"]
addopts = "-p no:cacheprovider"
# atomic_io is a vendored shelf directory with no manifest, so it cannot be declared: the vendor dir is the one undeclared path (docs/design/workspace.md section 4)
pythonpath = ["../../skills/task-loop/_vendor"]
