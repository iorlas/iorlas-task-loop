[project]
name = "tlareas"
version = "0"
description = "Area policy. Imports only the kernel."
requires-python = ">=3.15"
dependencies = ["tlkernel"]

[tool.uv.sources]
tlkernel = { workspace = true }
tltestkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlareas"]

[dependency-groups]
dev = ["pytest", "tltestkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*"]
addopts = "-p no:cacheprovider"
pythonpath = ["src", "../../skills/task-loop/_vendor"]
