[project]
name = "tlwork"
version = "0"
description = "Work review and domain rules. Imports the kernel and the gate package (settles reads tlgate.domain.planref)."
requires-python = ">=3.15"
dependencies = ["tlkernel", "tlgate", "tlartifacts"]

[tool.uv.sources]
tlkernel = { workspace = true }
tlgate = { workspace = true }
tlartifacts = { workspace = true }
tltestkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlwork"]

[dependency-groups]
dev = ["pytest", "tltestkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*"]
addopts = "-p no:cacheprovider"
# atomic_io is a vendored shelf directory with no manifest, so it cannot be declared: the vendor dir is the one undeclared path (docs/design/workspace.md section 4)
pythonpath = ["src", "../../skills/task-loop/_vendor"]
