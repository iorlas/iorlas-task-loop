# DRAFT v6 "candidate": the slim shape for slice 1. Steps and prompt sections only. Everything the engine decodes,
# enforces or must keep safe stays in code and is appended automatically (see the list at the end).
# Formatting convention under test: one sentence per line using TOML line-ending backslashes, so a one-sentence A/B edit
# is a one-line git diff. Prose abbreviated with `…`; a real file carries it verbatim. Not loadable; a design sketch.

[workflow]
name = "default"
schema = 1

[[step]]
name = "plan"
[step.agent]
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"

[[step.prompt]]
text = """\
Your final message must be the JSON answer only; \
write plan.md before you answer `planned`; \
a message without a tool call ends the step."""

[[step.prompt]]
text = """\
First assess depth from the supplied task text alone, before any exploration or reading.
State the depth in your first commentary message so the dashboard conversation shows it for owner correction.
…
Give a one-sentence reason, state whether an owner decision is missing or a dependency is unlanded, \
and state the evidence-gathering budget in model calls: small 6, medium 12, large 20.
…"""

[[step.prompt]]
use = "task"                      # title, requirements, acceptance of the task

[[step.prompt]]
use = "input_context"             # commit, check commands, glossary excerpt, shelf digest

[[step.prompt]]
text = """\
After the depth assessment permits planning, follow this plan-only reading order.
…
Search with an explicit repository path scope and a count first (`rg -c`) before printing matching lines.
…"""

[[step.prompt]]
use = "plan_template"             # headings, Depth line and byte caps: owned by the plan validator

[[step.prompt]]
text = """\
Before answering `planned` or `unchanged`, require a Size estimate in Header with estimated changed files, \
independent behaviours, and model calls for one implement attempt.
…
If any estimate exceeds 60 files, 3 independent behaviours or 100 model calls, answer `needs_owner`.
…"""

[[step]]
name = "implement"
[step.agent]
harness = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[[step.prompt]]
use = "task"

[[step.prompt]]
use = "input_context"

[[step.prompt]]
use = "plan_reference"            # "The plan for this task is `docs/design/<id>/plan.md` … Read it first."

[[step.prompt]]
text = """\
Immediately after reading the plan, reassess scope before broad exploration or editing.
Read its `## Read list` by the stated line ranges before exploring other files.
…
If the work needs more than about 60 model calls or touches more than 60 files, stop after the first coherent part …"""

[[step.prompt]]
text = """\
The factory ran this repository's `setup` before you started; uv uses the prepared cache offline.
While working, run only focused test files for the code you changed.
For lint and type validation, run `just check 2>&1 | tail -60` at most twice while working.
After finishing edits, run `just check 2>&1 | tail -60` once and then `just test 2>&1 | tail -40` once.
…
Make every file edit with `apply_patch`, never with a Python or sed script.
…"""

[[step]]
name = "check"
# no agent, no prompt: runs the profile's required checks. Repeat cap and loop shape are engine constants in slice 1.

# --------------------------------------------------------------------------------------------------
# Appended by code, never in the file, cannot be removed or reworded by a variant:
#   answer schema and decoder; dispositions and effects; StepRules (root, max_paths, file cap, deletions, excluded paths
#   including `.task-loop/`); Git-write, saved-work, plan-handoff and plan-metadata sentences; the commit-limits sentence;
#   repeat frames and openings, failed-check feedback; attempt cap and main_moved reruns; access policy (machine config);
#   profile keys (setup, checks, required, target, land).
# Identity recorded per attempt: workflow name + digest of this file, engine version + commit (dirty flag), input_digest.
