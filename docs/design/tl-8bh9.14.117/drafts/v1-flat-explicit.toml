# DRAFT v1 "flat explicit": every fact of today's default workflow written out in one file, steps as an ordered array.
# Prose is abbreviated with `…` and a `# source:` note; a real file would carry it verbatim. Not loadable; a design sketch.
# Shape: [workflow] header, [[step]] array (plan, implement, check), each step owning agent, rules, prompt sections,
# answer contract (dispositions to effects) and its repeat behaviour. Profile (setup, checks, required, target, land) stays out.

[workflow]
name = "default"
schema = 1                       # the file's own format version

# ---------------------------------------------------------------- plan
[[step]]
name = "plan"                    # registered step class `plan`
[step.agent]
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"
compaction_token_limit = 0       # unset; codex only
[step.rules]                     # StepRules: what the agent may commit
root = "docs/design/{task_id}/"  # placeholder is the ONE interpolated value; see review question
max_paths = 32
file_cap_bytes = 1048576
deletions = false
excluded = []
[step.answer]                    # disposition -> effect (answer contract; schema keys are fixed in code)
planned = "commit"
unchanged = "keep"
incomplete = "none"
needs_owner = "none"
[step.artifact]                  # the plan.md rule at X
file = "plan.md"
caps_by_depth = { small = 4000, medium = 8000, large = 12000 }
[step.repeat]
attempts = 3
on = ["uncommitted", "unsafe", "ignored"]

[[step.prompt]]
text = """Your final message must be the JSON answer only; write plan.md before you answer `planned`; a message without a tool call ends the step."""
[[step.prompt]]
text = """First assess depth from the supplied task text alone, before any exploration or reading. … Large: more than 3 independent behaviours, or a schema version change … small 6, medium 12, large 20 evidence calls. …"""
# source: plan_step.DEPTH_ASSESSMENT (~3.3 KB). Numbers 3, 60, 6/12/20 appear here AND in the closing section below.
[[step.prompt]]
use = "task"                     # title, requirements, acceptance
[[step.prompt]]
use = "input_context"            # commit, commands, AGENTS.md note, glossary excerpt, shelf digest
[[step.prompt]]
text = """After the depth assessment permits planning, follow this plan-only reading order. … 1. AGENTS.md rules are already in context … Search with an explicit repository path scope and a count first (`rg -c`) …"""
# source: plan_step._closing_words reading order + search rules
[[step.prompt]]
text = """Use exactly these sections in this order, with UTF-8 byte allowances: # Header … ## Outcome and non-goals: 800 bytes. ## Settled decisions … ## Change map … ## Read list … ## Work packages … ## Acceptance behaviours …"""
# source: plan_step.TEMPLATE (~2.6 KB). The byte caps 4000/8000/12000 are ALSO in [step.artifact] above.
[[step.prompt]]
text = """Before answering `planned` or `unchanged`, require a Size estimate in Header … If any estimate exceeds 60 files, 3 independent behaviours or 100 model calls, answer `needs_owner` … """
[[step.prompt]]
use = "contract.git_writes"      # code-owned, always appended even if omitted here (shown for completeness)
[[step.prompt]]
use = "contract.saved_work"
[[step.prompt]]
use = "contract.plan_metadata"   # plan-metadata.json rule: prepared_commit, cited_paths

[step.repeat_prompt]             # a repeat's own input frame
opening.uncommitted = "Attempt {number} of this step left changes in the slot that it did not list for commit."
opening.unsafe = "These paths cannot be committed."
opening.ignored = "These paths are ignored by Git. …"
# frame: opening, listing between nonce markers, instructions, then attempt 1's input; the frame is code-owned.

# ---------------------------------------------------------------- implement
[[step]]
name = "implement"
[step.agent]
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"
[step.rules]
root = ""
max_paths = 96
file_cap_bytes = 1048576
deletions = true
excluded = [".beads/", ".task-loop/"]   # .task-loop/ is new: keeps the agent from editing its own workflow
[step.answer]
implemented = "commit"
unchanged = "keep"
incomplete = "none"
needs_owner = "none"
[step.repeat]
attempts = 3                     # shared with check-driven repeats today (one counter)
on = ["uncommitted", "unsafe", "ignored"]

[[step.prompt]]
use = "task"
[[step.prompt]]
use = "input_context"
[[step.prompt]]
text = """The plan for this task is `docs/design/{task_id}/plan.md`, committed on this branch by the plan step. Read it first. … If the work needs more than about 60 model calls or touches more than 60 files, stop … answer `needs_owner` …"""
[[step.prompt]]
text = """The factory ran this repository's `setup` before you started … run `just check 2>&1 | tail -60` at most twice while working … `just test 2>&1 | tail -40` once … First confirm that `apply_patch` is offered … Bare `python3` is the host's Python 3.12 …"""
# source: implement_step.ENVIRONMENT (~2.7 KB). Repo facts (just check, uv, Python 3.15, apply_patch) live in engine prose today;
# in a workflow file they are the repo's own words, but they duplicate the profile's `checks` names.
[[step.prompt]]
use = "contract.git_writes"
[[step.prompt]]
use = "contract.saved_work"
[[step.prompt]]
use = "contract.plan_handoff"    # do not edit plan.md; handoff goes in the commit message

[step.failed_check_prompt]       # the check-driven repeat input (a feedback section list)
text = "The factory's check failed. Fix the reported failure and run the checks before answering."
sections = ["check_name", "check_argv", "check_result", "check_output_tail"]   # typed FailedCheck fields

# ---------------------------------------------------------------- check
[[step]]
name = "check"                   # no agent; runs the profile's `checks`
[step.repeat]
to = "implement"                 # a failed required check repeats implementation
attempts = 3                     # same counter as above today
rerun_on_main_moved = 3          # fixed engine behaviour today; shown for completeness
