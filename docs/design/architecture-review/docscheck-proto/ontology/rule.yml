name: rule
storage: inline
key: id
when_to_use: one binary present-tense requirement; true or the system is wrong
fields:
  - {name: id, type: int, required: true}
  - {name: applies_to, type: string, required: true, rigid: true}
  - {name: holds, type: string, required: true, standalone: true, rigid: true}
  - {name: check, type: "link[check]", required: false, default: none}
  - {name: probe, type: string, required: false}
