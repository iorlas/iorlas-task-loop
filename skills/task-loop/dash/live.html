<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>live · task-loop</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--ink:#c9d1d9;--dim:#6e7681;--ok:#7ee787;--bad:#ff7b72;--amber:#e3b341;--blue:#79c0ff;--mag:#d2a8ff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.h1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.h1 a{color:var(--dim);text-decoration:none}.h1 a:hover{color:var(--ink)}
.bead{color:var(--blue);font-weight:600}.title{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.h2{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:4px;color:var(--dim);font-variant-numeric:tabular-nums}
.h2 b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px}
.run .dot{background:var(--ok);animation:p 1.6s ease-in-out infinite}.run .dot.am{background:var(--amber)}.run .dot.rd{background:var(--bad)}
@keyframes p{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.run .dot{animation:none}}
.idle{color:var(--dim)}.idle.am{color:var(--amber)}.idle.rd{color:var(--bad)}
#note{margin:12px 16px 0;padding:8px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--dim)}
main{padding:8px 16px 80px;max-width:1100px}
.sec{display:flex;gap:10px;align-items:baseline;margin:22px 0 6px;color:var(--mag);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:3px}
.sec:first-child{margin-top:8px}.sec .d{margin-left:auto;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
.row{padding:1px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.cmd{cursor:pointer;display:flex;gap:10px}.cmd .t{flex:1;min-width:0;overflow-wrap:anywhere}.cmd .t::before{content:"$ ";color:var(--dim)}
.cmd .m{flex:none;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmd.go .m{color:var(--blue)}.cmd.ok .m b{color:var(--ok);font-weight:500}.cmd.bad .m b,.cmd.bad .t{color:var(--bad)}
.out{margin:2px 0 6px 16px;padding:6px 10px;background:var(--panel);border-left:2px solid var(--line);color:var(--dim);max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.tool{color:var(--dim)}.tool .m{font-variant-numeric:tabular-nums}
.msg{color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;margin:4px 0}
.msg.open{display:block}
.think{color:var(--dim);font-style:italic;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.think.open{white-space:pre-wrap}
.note{color:var(--dim)}.warn{color:var(--amber)}.bad{color:var(--bad)}
.gap{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:11px;margin:3px 0}.gap::before,.gap::after{content:"";flex:1;border-top:1px solid var(--line)}
#latest{position:fixed;right:16px;bottom:16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:12px var(--mono);cursor:pointer;display:none}
#latest.on{display:block}
@media (max-width:600px){html,body{font-size:12.5px}header{padding:8px 12px}main{padding:6px 12px 80px}#note{margin:10px 12px 0}.cmd{flex-direction:column;gap:0}.cmd .m{padding-left:2ch}}
</style>
</head>
<body>
<header><div class="h1"><a href="/" title="Roadmap">&lsaquo; task-loop</a><span class="bead" id="bead"></span><span class="title" id="title"></span></div>
<div class="h2" id="h2"></div></header>
<div id="note" hidden></div>
<main id="term"><div class="note">connecting…</div></main>
<button id="latest">&darr; latest</button>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search),BEAD=P.get('bead')||'',RUN=P.get('run')||'';
const St={ev:[],seen:new Set(),cursor:'',run:'',step:'',lane:'',model:'',effort:'',started:0,running:true,detail:false,skew:0,open:new Set(),tok:null,err:'',cost:null,loaded:false};
const nowS=()=>Date.now()/1000+St.skew;
function dur(s){s=Math.max(0,s);if(s<10)return s.toFixed(1)+'s';s=Math.round(s);if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m'+String(s%60).padStart(2,'0')+'s';const h=Math.floor(m/60);return h+'h'+String(m%60).padStart(2,'0')+'m'}
function dur0(s){s=Math.round(Math.max(0,s));if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m'+String(s%60).padStart(2,'0')+'s';const h=Math.floor(m/60);return h+'h'+String(m%60).padStart(2,'0')+'m'}
const keyOf=e=>e.src+'|'+e.k+'|'+e.t+'|'+(e.id||'')+'|'+(e.text||'').length;

// ---- model: events -> rows -------------------------------------------------------------------------------------------
function build(){
  const rows=[],cmds={},tools={};let last=null,prevT=null,openCmds=0,sec=null;
  const ev=St.ev;
  for(let i=0;i<ev.length;i++){const e=ev[i];
    if(e.k==='cmd_end'){const c=cmds[e.id];if(c){c.end=e.t;c.exit=e.exit;c.secs=e.secs!=null?e.secs:e.t-c.t;c.out=e.out;openCmds=Math.max(0,openCmds-1)}continue}
    if(e.k==='tool_end'){const c=tools[e.id];if(c){c.secs=e.t-c.t;if(e.text)c.text=e.text}continue}
    if(['tokens','step_end','raw','start'].includes(e.k))continue;
    if(prevT!=null&&e.t-prevT>10&&openCmds===0)rows.push({k:'gap',secs:e.t-prevT});
    prevT=Math.max(prevT||0,e.t);
    if(e.k==='step'){sec={k:'sec',t:e.t,step:e.step||e.text,end:null};rows.push(sec);continue}
    if(e.k==='cmd'){const c={k:'cmd',id:e.id,t:e.t,text:e.text,exit:null,secs:null,end:null};cmds[e.id]=c;openCmds++;rows.push(c);continue}
    if(e.k==='tool'){const c={k:'tool',id:e.id,t:e.t,text:e.text,secs:null};tools[e.id]=c;rows.push(c);continue}
    rows.push(Object.assign({},e));
  }
  const secs=rows.filter(r=>r.k==='sec');secs.forEach((s,i)=>{s.end=i+1<secs.length?secs[i+1].t:null});
  return rows;
}
function render(){
  const rows=build(),open=St.open,t=$('term');let h='';
  for(const r of rows){
    if(r.k==='sec')h+=`<div class="sec"><span>&sect; ${esc(r.step)}</span><span class="d tick" data-t0="${r.t}" ${r.end?`data-t1="${r.end}"`:(St.running?'':`data-t1="${St.ev.length?St.ev[St.ev.length-1].t:r.t}"`)}></span></div>`;
    else if(r.k==='gap')h+=`<div class="gap">idle ${dur0(r.secs)}</div>`;
    else if(r.k==='cmd'){const done=r.exit!=null||r.end,bad=done&&r.exit!==0&&r.exit!=null;
      const cls=!done?'go':bad?'bad':'ok',id=esc(r.id);
      h+=`<div class="row cmd ${cls}" data-id="${id}"><span class="t">${esc(r.text)}</span><span class="m">${done?`<b>${r.exit==null?'?':'exit '+r.exit}</b> ${dur(r.secs)}`:`<span class="tick" data-t0="${r.t}"></span>`}</span></div>`;
      if(open.has(r.id))h+=`<div class="out">${r.out?esc(r.out):'<i>no output captured</i>'}</div>`}
    else if(r.k==='tool')h+=`<div class="row tool">${esc(r.text)} <span class="m">${r.secs!=null?dur(r.secs):''}</span></div>`;
    else if(r.k==='msg')h+=`<div class="row msg${open.has('m'+r.t)?' open':''}" data-id="m${r.t}">${esc(r.text)}</div>`;
    else if(r.k==='think')h+=`<div class="row think${open.has('t'+r.t)?' open':''}" data-id="t${r.t}">${esc(r.text)}</div>`;
    else if(r.k==='warn')h+=`<div class="row warn">&#9888; ${esc(r.text)}</div>`;
    else if(r.k==='stall')h+=`<div class="row warn">no output for ${dur0(r.secs)}</div>`;
    else if(r.k==='session')h+=`<div class="row note">${esc(r.text)}${r.secs!=null?' · '+dur0(r.secs):''}</div>`;
    else if(r.k==='end')h+=`<div class="row ${r.status==='done'?'note':'bad'}">worker ${esc(r.status)} · ${dur0(r.secs||0)}${r.cost_usd?' · $'+Number(r.cost_usd).toFixed(2):''}</div>`;
    else if(r.k==='note')h+=`<div class="row note">${esc(r.text)}</div>`;
  }
  if(!h)h='<div class="note">no events yet</div>';
  const stick=atBottom();t.innerHTML=h;if(stick)toEnd();tick();
}
// ---- header and tickers ------------------------------------------------------------------------------------------------
function tick(){
  const n=nowS(),lastT=St.ev.length?St.ev[St.ev.length-1].t:0,t0=St.started||(St.ev[0]&&St.ev[0].t)||n;
  document.querySelectorAll('.tick').forEach(el=>{const a=+el.dataset.t0,b=el.dataset.t1?+el.dataset.t1:n;el.textContent=dur(b-a)});
  const idle=Math.max(0,n-lastT),cls=!St.running?'':idle>300?'rd':idle>60?'am':'';
  const meta=[St.step&&`step <b>${esc(St.step)}</b>`,(St.lane||St.model)&&`<b>${esc([St.lane,St.model,St.effort].filter(Boolean).join(' / '))}</b>`,
    `elapsed <b>${dur0((St.running?n:lastT||n)-t0)}</b>`,
    St.running&&lastT?`<span class="idle ${cls}">idle ${dur0(idle)}</span>`:'',
    St.tok?`tokens <b>${Math.round((St.tok.in||0)/1000)}k in / ${Math.round((St.tok.out||0)/1000)}k out</b>`:'',
    St.err?`<span class="bad">${esc(St.err)}</span>`:''].filter(Boolean);
  $('h2').innerHTML=`<span class="${St.running?'run':''}"><i class="dot ${cls}"></i>${St.running?'running':St.loaded?'ended':'…'}</span>`+meta.map(x=>`<span>${x}</span>`).join('');
  $('note').hidden=!(St.loaded&&!St.detail);
}
// ---- scroll -----------------------------------------------------------------------------------------------------------
const atBottom=()=>document.documentElement.scrollHeight-window.scrollY-window.innerHeight<48;
const toEnd=()=>window.scrollTo(0,document.documentElement.scrollHeight);
window.addEventListener('scroll',()=>$('latest').classList.toggle('on',!atBottom()),{passive:true});
$('latest').onclick=()=>{toEnd()};
$('term').addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(!el||window.getSelection().toString())return;
  const id=el.dataset.id;St.open.has(id)?St.open.delete(id):St.open.add(id);const y=window.scrollY,stick=atBottom();render();if(!stick)window.scrollTo(0,y)});
// ---- polling ----------------------------------------------------------------------------------------------------------
async function poll(){
  let delay=1000;
  try{
    const q=new URLSearchParams({bead:BEAD,since:St.cursor});if(RUN)q.set('run',RUN);
    const r=await fetch('/api/live?'+q,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d.found){St.err=d.error||'not found';St.running=false;St.loaded=true;tick();return}
    St.err='';St.skew=d.now-Date.now()/1000;St.run=d.run;St.running=d.running;St.detail=d.worker_detail;
    if(d.step)St.step=d.step;if(d.lane)St.lane=d.lane;if(d.model)St.model=d.model;if(d.effort)St.effort=d.effort;if(d.started)St.started=d.started;
    St.cursor=d.cursor;let fresh=false;
    for(const e of d.events){const k=keyOf(e);if(St.seen.has(k))continue;St.seen.add(k);St.ev.push(e);fresh=true;
      if(e.k==='tokens')St.tok=e;if(e.k==='start'){if(e.lane)St.lane=e.lane;if(e.model)St.model=e.model;if(e.effort)St.effort=e.effort}}
    if(fresh){St.ev.sort((a,b)=>a.t-b.t);const s=[...St.ev].reverse().find(e=>e.k==='step');if(s)St.step=s.step||s.text}
    const first=!St.loaded;St.loaded=true;
    if(fresh||first){render();if(first)toEnd()}else tick();
    if(!d.running)return;   // the bead ended: this was the last fetch
  }catch(e){St.err='disconnected: '+e.message;delay=3000;tick()}
  setTimeout(poll,delay);
}
document.title='live · '+BEAD;$('bead').textContent=BEAD;
fetch('/api/tasks',{cache:'no-store'}).then(r=>r.json()).then(d=>{const t=(d.tasks||[]).find(x=>x.id===BEAD);if(t&&t.title)$('title').textContent=t.title}).catch(()=>{});
$('note').textContent='Engine rows only. Worker detail (commands, tools, messages) starts with the new delegate; this run has none.';
setInterval(tick,250);poll();
</script>
</body>
</html>
