<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<title>task-loop</title>
<style>
:root{
  --bg:#f6f6f4;--surface:#ffffff;--raise:#fbfbfa;--sunk:#efefec;--ink:#1b1c1e;--ink2:#3d4046;--mute:#6c7079;--faint:#a3a6ad;
  --line:#e5e5e1;--line2:#d9d9d4;--hover:#f1f1ee;--ring:#4f6bed;
  --codex:#0e9384;--claude:#c96442;--engine:#8a909a;
  --ok:#1f8f4e;--ok-bg:#e7f5ec;--fail:#cf3a3a;--fail-bg:#fbeaea;--warn:#b7791f;--warn-bg:#fbf2e2;
  --ask:#4f5fe0;--ask-bg:#ecefff;--wait:#6a7793;--wait-bg:#eef0f5;--run:#2a7de1;--run-bg:#e8f1fd;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 1px 1px rgba(20,20,30,.03);--shadow2:0 12px 40px rgba(20,20,30,.16),0 2px 6px rgba(20,20,30,.06);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1012;--surface:#17181b;--raise:#1b1c20;--sunk:#222327;--ink:#ebebe8;--ink2:#c9cacd;--mute:#9a9da5;--faint:#62656c;
  --line:#26282c;--line2:#31343a;--hover:#1f2125;--ring:#8ea2ff;
  --codex:#3fd0bd;--claude:#ee9a76;--engine:#8d94a0;
  --ok:#4fd087;--ok-bg:#12291d;--fail:#ff7b7b;--fail-bg:#351919;--warn:#f2b84b;--warn-bg:#33270f;
  --ask:#9aabff;--ask-bg:#1d2246;--wait:#a3afc7;--wait-bg:#20242d;--run:#6cb0ff;--run-bg:#13263e;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 16px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1012;--surface:#17181b;--raise:#1b1c20;--sunk:#222327;--ink:#ebebe8;--ink2:#c9cacd;--mute:#9a9da5;--faint:#62656c;
  --line:#26282c;--line2:#31343a;--hover:#1f2125;--ring:#8ea2ff;
  --codex:#3fd0bd;--claude:#ee9a76;--engine:#8d94a0;
  --ok:#4fd087;--ok-bg:#12291d;--fail:#ff7b7b;--fail-bg:#351919;--warn:#f2b84b;--warn-bg:#33270f;
  --ask:#9aabff;--ask-bg:#1d2246;--wait:#a3afc7;--wait-bg:#20242d;--run:#6cb0ff;--run-bg:#13263e;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 16px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-size:12px}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
@supports (backdrop-filter:blur(1px)){.bar{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(12px)}}
.bar-in{max-width:1180px;margin:0 auto;height:52px;display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.015em;font-size:15px}
.logo{width:18px;height:18px;border-radius:6px;background:conic-gradient(from 200deg,var(--codex),var(--claude),var(--codex));box-shadow:inset 0 0 0 4px var(--bg)}
.host{color:var(--faint);font-size:12px;font-weight:450}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a{padding:6px 11px;border-radius:8px;color:var(--mute);font-weight:520;font-size:13px;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ask);color:#fff;font-size:11px;font-weight:650;display:inline-flex;align-items:center;justify-content:center}
.badge:empty{display:none}
.sp{flex:1}
.lanes{display:flex;flex-wrap:wrap;gap:6px;max-width:1180px;margin:0 auto;padding:0 20px}
.lanes:not(:empty){padding-top:12px}
.lane{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.lane i{width:7px;height:7px;border-radius:50%;background:var(--fail)}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mute);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}

main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}

/* ---- chips ---- */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:560;white-space:nowrap;background:var(--sunk);color:var(--ink2);max-width:100%}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip .x{overflow:hidden;text-overflow:ellipsis}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-fail{background:var(--fail-bg);color:var(--fail)}.s-warn{background:var(--warn-bg);color:var(--warn)}
.s-ask{background:var(--ask-bg);color:var(--ask)}.s-wait{background:var(--wait-bg);color:var(--wait)}.s-run{background:var(--run-bg);color:var(--run)}
.s-info{background:var(--sunk);color:var(--mute)}
.s-run .d{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(42,125,225,.45)}50%{box-shadow:0 0 0 5px rgba(42,125,225,0)}}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:600;background:var(--sunk);color:var(--mute);letter-spacing:.01em}
.tag.fb{background:var(--wait-bg);color:var(--wait)}

/* ---- home ---- */
.hero{display:flex;align-items:flex-end;gap:16px;margin:4px 0 18px;flex-wrap:wrap}
.hero h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:680}
.hero .sum{color:var(--mute);font-size:13px}
.search{margin-left:auto;position:relative}
.search input{width:240px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px 0 32px;font:inherit;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(79,107,237,.16)}
.search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:var(--faint)}
.group{margin:0 0 26px}
.group h2{font-size:12px;letter-spacing:.01em;color:var(--mute);font-weight:600;margin:0 0 8px 2px;display:flex;gap:8px;align-items:center}
.group h2 .n{color:var(--faint);font-weight:500}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);overflow:hidden}
.task{display:grid;grid-template-columns:10px minmax(0,1fr) auto 150px;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);transition:background .12s}
.task:first-child{border-top:0}
.task:hover{background:var(--hover)}
.task .sd{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.task .t1{font-weight:560;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.task .t2{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;margin-top:1px;white-space:nowrap;overflow:hidden}
.task .right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--mute);white-space:nowrap}
.task .right b{font-weight:560;color:var(--ink2)}
.task .stagecol{max-width:300px;min-width:0;display:flex;justify-content:flex-end}
.slot{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--sunk);color:var(--ink2)}
.st-running .sd{background:var(--run);animation:pulse 1.6s ease-in-out infinite}.st-asks .sd{background:var(--ask)}.st-paused .sd,.st-waiting .sd,.st-queued .sd,.st-blocked_by .sd{background:var(--wait)}
.st-landed .sd,.st-done .sd{background:var(--ok)}.st-failed .sd,.st-stopped .sd,.st-blocked .sd{background:var(--fail)}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:15px}
.empty code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:2px 6px;border-radius:5px}
.more{display:block;width:100%;padding:11px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
.more:hover{background:var(--hover);color:var(--ink)}

/* ---- task ---- */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font-size:13px;font-weight:520;margin:0 0 10px -6px;padding:4px 6px;border-radius:7px}
.back:hover{color:var(--ink);background:var(--hover)}
.thead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.thead h1{font-size:21px;line-height:1.3;letter-spacing:-.02em;margin:0 0 6px;font-weight:680}
.tmeta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:13px;align-items:center}
.tmeta .mono{color:var(--ink2)}
.thead>.chip{margin-top:3px;flex:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:0 0 12px 2px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .hint{margin-left:auto}
.askbox{background:var(--surface);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);border-left:3px solid var(--ask);padding:16px 18px;margin:0 0 20px}
.askbox h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:10px;font-weight:620;flex-wrap:wrap}
.askbox .q{font-size:14px;line-height:1.6;color:var(--ink2);max-height:340px;overflow:auto}.askbox .q.raw{white-space:pre-wrap}
.md p{margin:0 0 6px}.md ul{margin:2px 0 8px;padding-left:20px}.md li{margin:2px 0}.md code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--raise);border-radius:4px;padding:1px 4px}
.mdt,.opttab{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}.mdt th,.mdt td,.opttab th,.opttab td{border-top:1px solid var(--line2);padding:7px 8px;text-align:left;vertical-align:top}.mdt th,.opttab th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:620;border-top:0}
.askbox .opttab .opt{width:auto;display:inline-block}.opttab td:first-child{width:34%}.opttab td:empty{display:none}
@media(max-width:640px){.opttab thead{display:none}.opttab tr,.opttab td{display:block}.opttab td{border:0;padding:3px 0}.opttab tr{border-top:1px solid var(--line2);padding:8px 0}.opttab td:first-child{width:auto}.opttab td[data-l]:not(:first-child):not(:empty)::before{content:attr(data-l) ": ";color:var(--mute);font-size:11px;text-transform:uppercase}}
.askbox textarea{display:block;width:100%;min-height:80px;margin:12px 0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical;outline:none}
.askbox textarea:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(79,107,237,.16)}
.askbox .opts{display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
.askbox .opt{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);font:inherit;font-size:13px;line-height:1.45;cursor:pointer}
.askbox .opt:hover{border-color:var(--ring)}
.askbox .opt[disabled]{opacity:.5;cursor:default}
.askbox .opt b{font-weight:620}
.askbox .opt small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.askbox .opt.rec{border-color:var(--ask);box-shadow:inset 0 0 0 1px var(--ask)}
.askbox .opt .tag{font-size:11px;font-weight:620;color:var(--ask);margin-left:8px;text-transform:uppercase;letter-spacing:.03em}
.askbox .unb{font-size:12px;font-weight:620;color:var(--ask)}.askbox .lbl{font-size:11px;font-weight:620;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-right:6px}
.askbox .cost{color:var(--p-blocked)}.askbox .msg{font-size:14px;font-weight:620}.askbox.sent{border-left-color:var(--ok)}.askbox.sent .msg{color:var(--ok)}.askbox .next{font-size:13px;color:var(--ink2);margin-top:4px}
.askbox .undo{color:var(--ring);cursor:pointer;text-decoration:underline;font-weight:400}.askbox details.more{margin-top:8px;font-size:13px;color:var(--mute)}.asks h2.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
.askbox .asknote{font-size:12px;color:var(--p-blocked);margin:6px 0 0}
.btn{height:34px;padding:0 14px;border-radius:9px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn[disabled]{opacity:.5;cursor:default}
.answered{margin-top:10px;font-size:13px;color:var(--ok)}

.run{background:var(--surface);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);margin:0 0 12px;padding:14px 16px 16px}
.rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rn{font-weight:650;font-size:13px;letter-spacing:-.005em}
.because{font-size:12px;color:var(--ink2);background:var(--sunk);padding:2px 9px;border-radius:999px;font-weight:520}
.because.b-answer{background:var(--ask-bg);color:var(--ask)}.because.b-resume{background:var(--wait-bg);color:var(--wait)}.because.b-retry{background:var(--warn-bg);color:var(--warn)}
.rt{color:var(--mute);font-size:12px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:12px}
.step{display:flex;align-items:stretch}
.blk{position:relative;width:186px;text-align:left;background:var(--raise);border-radius:11px;box-shadow:inset 0 0 0 1px var(--line);padding:9px 11px 10px 14px;display:flex;flex-direction:column;gap:2px;transition:transform .12s,box-shadow .15s,background .15s;overflow:hidden}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--engine);opacity:.75}
.blk.f-openai::before{background:var(--codex);opacity:1}.blk.f-claude::before{background:var(--claude);opacity:1}
.blk:hover{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),var(--shadow2);transform:translateY(-1px)}
.blk.sel{box-shadow:inset 0 0 0 2px var(--ring),var(--shadow2)}
.bk1{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.bkk{font-weight:640;font-size:13px;letter-spacing:-.005em}
.bks{font-size:11px;color:var(--faint);font-weight:520}
.bkw{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.bkw .fam{font-weight:620}
.f-openai .bkw .fam{color:var(--codex)}.f-claude .bkw .fam{color:var(--claude)}.f-engine .bkw .fam{color:var(--mute)}
.bkm{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:6px;align-items:center;overflow:hidden}
.bkm .tag{flex:none}
.bkr{margin-top:5px;min-width:0}
.bkr .chip{height:22px;font-size:11.5px}
.conn{width:104px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 6px;color:var(--faint);gap:5px}
.conn.short{width:28px}
.conn .ln{width:100%;height:2px;background:currentColor;position:relative;border-radius:2px;opacity:.65}
.conn .ln::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid currentColor;border-right:0}
.conn .lbl{font-size:11px;line-height:1.3;text-align:center;font-weight:560;max-width:100%}
.c-fail{color:var(--fail)}.c-warn{color:var(--warn)}.c-ask{color:var(--ask)}.c-wait{color:var(--wait)}.c-ok{color:var(--ok)}.c-info{color:var(--faint)}
.c-info .lbl{color:var(--mute)}
.sec{flex-basis:100%;min-width:0;margin:4px 0 0;padding-top:10px;border-top:1px dashed var(--line2)}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.sechd{display:flex;align-items:baseline;gap:8px;margin:0 0 9px 2px;font-size:12px;color:var(--mute);min-width:0}
.sechd b{font-weight:640;color:var(--ink2);white-space:nowrap;flex:none}
.sechd .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sec .chain{row-gap:12px}
.tag.stg{background:var(--sunk);color:var(--ink2);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
.bksf{font-size:11px;line-height:1.35;color:var(--warn);font-weight:560;display:flex;align-items:flex-start;gap:5px;margin-top:2px}
.bksf::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor;flex:none;margin-top:3px}
.endp{align-self:center;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;font-size:12.5px;font-weight:620;max-width:240px}
.endp .d{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(10,10,15,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);box-shadow:var(--shadow2);z-index:31;transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.drawer.on{transform:none}
.dh{padding:16px 16px 12px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .bar4{width:4px;align-self:stretch;border-radius:3px;background:var(--engine);flex:none}
.dh.f-openai .bar4{background:var(--codex)}.dh.f-claude .bar4{background:var(--claude)}
.dh h2{margin:0;font-size:17px;letter-spacing:-.015em;font-weight:660}
.dh .sub{color:var(--mute);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 12px}
.dh .x{margin-left:auto}
.dtabs{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.dtabs button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:540;color:var(--mute);white-space:nowrap}
.dtabs button:hover{background:var(--hover);color:var(--ink)}
.dtabs button.on{background:var(--sunk);color:var(--ink)}
.dtabs .cnt{color:var(--faint);font-weight:500;margin-left:4px}
.db{flex:1;overflow:auto;padding:14px 18px 40px;-webkit-overflow-scrolling:touch}
.sect{margin:0 0 16px}
.sect h4{margin:0 0 8px;font-size:12px;color:var(--mute);font-weight:600}
.summary{font-size:13.5px;line-height:1.55;color:var(--ink2);white-space:pre-wrap}
.came{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute)}
.find{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.find:first-of-type{border-top:0}
.find .where{font-family:var(--mono);font-size:11.5px;color:var(--mute);display:block;margin-top:2px}
.ck{border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);margin:0 0 8px;overflow:hidden}
.ck summary{list-style:none;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 11px;cursor:pointer}
.ck summary::-webkit-details-marker{display:none}
.ck summary:hover{background:var(--hover)}

    <a href="#" data-nav="roadmap">Roadmap</a>
    <a href="#tasks" data-nav="tasks">Tasks</a>
    <a href="#asks" data-nav="asks">Asks <span class="badge" id="askn"></span></a>
    <a href="#looks" data-nav="looks">Looks <span class="badge" id="lookn"></span></a>
    <a href="#causes" data-nav="causes">Causes</a>
    <a href="/classic" title="The three-pane log viewer">Logs</a>
  </nav>
  <span class="sp"></span>
  <button class="iconbtn" id="theme" title="Theme: auto" aria-label="Switch theme"></button>
</div></header>
<div class="lanes" id="lanes"></div>
<main id="main"><div class="loading">Loading…</div></main>
<div class="scrim" id="scrim"></div>
<div id="bscrim"></div><aside id="bpanel" aria-hidden="true" role="dialog" aria-label="Bead details"></aside>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Block details"></aside>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={view:'tasks',task:null,repo:'',run:null,block:null,tab:null,q:'',showAll:false,tasks:null,asks:{asks:[],delegate:{ok:true}},tl:null,blk:null,events:null,sig:{},gen:0};

// ---- format -----------------------------------------------------------------------------------------------------
function dur(s){if(s==null||isNaN(s))return'';s=Math.max(0,Math.round(s));if(s<60)return s+'s';const m=Math.floor(s/60);
  if(m<60)return m+'m'+(s%60&&m<10?' '+(s%60)+'s':'');const h=Math.floor(m/60);if(h<48)return h+'h'+(m%60?' '+(m%60)+'m':'');return Math.floor(h/24)+'d '+(h%24)+'h'}
function ago(t){if(!t)return'';const s=Date.now()/1000-t;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';
  if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
function hm(t,short){if(!t)return'';const d=new Date(t*1000),n=new Date();const x=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  return short||d.toDateString()==n.toDateString()?x:d.toLocaleDateString([],{weekday:'short'})+' '+x}
function tok(t){if(!t)return'';const n=(t.in||0)+(t.out||0);if(!n)return'';return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M tok':n>=1e3?Math.round(n/1e3)+'k tok':n+' tok'}
function model(m){if(!m)return'';m=String(m);const k=m.match(/^(opus|sonnet|haiku|fable)[-_ ]?(.*)$/i);
  if(k)return k[1][0].toUpperCase()+k[1].slice(1).toLowerCase()+(k[2]?' '+k[2].replace(/-/g,'.'):'');return m.replace(/^gpt-/i,'GPT-')}
function effort(e){return e?({medium:'med'}[e]||e):''}
const STATE={queued:'s-wait',blocked_by:'s-wait',running:'s-run',asks:'s-ask',paused:'s-wait',waiting:'s-wait',landed:'s-ok',done:'s-ok',failed:'s-fail',stopped:'s-fail',blocked:'s-fail'};
const CAUSE={checks_red:'fail',gate_red:'fail',conflict:'fail',verify_wrong:'fail',failed:'fail',stopped:'fail',
  review_sendback:'warn',rounds_used:'warn',bad_checks:'warn',writer_decided:'warn',plan_sent_back:'warn',invalid_output:'warn',push_race:'warn',
  lane_out:'wait',paused:'wait',lane_wait:'wait',retry:'wait',decision:'ask',verify:'ask',ticket:'ask',stuck:'ask',waiting:'ask',verify_open:'ask',needs_human:'ask',denied:'ask',budget:'ask',
  accepted:'ok',checks_green:'ok',landed:'ok',done:'ok',verified:'ok'};
function chip(cls,text,dot){return `<span class="chip ${cls}" title="${esc(text)}">${dot!==false?'<span class="d"></span>':''}<span class="x">${esc(text)}</span></span>`}

// ---- routing: #task=ID&repo=R&run=RUN&block=NODE.K&tab=T&theme=dark --------------------------------------------------
function readHash(){const raw=location.hash.slice(1),h=new URLSearchParams(raw);
  S.view=h.get('task')?'task':({asks:'asks',tasks:'tasks',looks:'looks',causes:'causes'}[raw.split('&')[0]]||'roadmap');S.task=h.get('task');S.repo=h.get('repo')||'';
  S.bead=h.get('bead')||null;const b=h.get('block');S.run=h.get('run');S.block=b?{node:+b.split('.')[0],k:+(b.split('.')[1]||0)}:null;S.tab=h.get('tab');
  const th=h.get('theme');if(th)setTheme(th,true)}
function go(o){const h=new URLSearchParams();if(o.task){h.set('task',o.task);if(o.repo)h.set('repo',o.repo);if(o.run)h.set('run',o.run);
  if(o.block)h.set('block',o.block);if(o.tab)h.set('tab',o.tab)}const s=o.asks?'asks':o.roadmap?'roadmap'+(o.repo?'&repo='+encodeURIComponent(o.repo):''):h.toString();
  if(location.hash.slice(1)!=s)location.hash=s;else route()}
window.addEventListener('hashchange',route);
let lastView='';
function route(){const was=S.task+'|'+S.run+'|'+(S.block?S.block.node+'.'+S.block.k:'');readHash();
  document.querySelectorAll('#nav a[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav==(S.view=='asks'?'asks':S.view=='looks'?'looks':S.view=='causes'?'causes':S.view=='roadmap'?'roadmap':'tasks')));
  $('main').classList.toggle('wide',S.view=='roadmap'||S.view=='looks'||S.view=='causes');
  if(was!=S.task+'|'+S.run+'|'+(S.block?S.block.node+'.'+S.block.k:'')){S.blk=null;S.events=null}
  const v=S.view+'|'+S.task;if(v!=lastView){lastView=v;S.sig.main=null;window.scrollTo(0,0)}
  S.gen++;render();poll()}

// ---- theme --------------------------------------------------------------------------------------------------------
const ICON={auto:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3"/></svg>',
  dark:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M16 12.3A6.5 6.5 0 0 1 7.7 4a6.5 6.5 0 1 0 8.3 8.3z"/></svg>'};
function setTheme(t,nosave){if(!ICON[t])t='auto';if(t=='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  $('theme').innerHTML=ICON[t];$('theme').title='Theme: '+t;if(!nosave)try{localStorage.setItem('tl.theme',t)}catch(e){}}
$('theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'auto';setTheme({auto:'light',light:'dark',dark:'auto'}[cur])};
(()=>{let t='auto';try{t=localStorage.getItem('tl.theme')||'auto'}catch(e){}setTheme(t,true)})();
(()=>{const u=new URLSearchParams(location.search);const tk=u.get('token');if(tk){try{localStorage.setItem('tl.token',tk)}catch(e){}}})();  // loopback and Tailscale need none; the link's token is for any other address

// ---- data ---------------------------------------------------------------------------------------------------------
const get=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.json()};
const lastRun=d=>d&&d.runs&&d.runs.length?d.runs[d.runs.length-1].run:null;
const runOf=(d,r)=>d&&d.runs?d.runs.find(x=>x.run==r):null;
let busy=false;
async function poll(){if(busy)return;busy=true;const g=S.gen;
  try{
    const a=get('/api/asks').then(x=>{S.asks=x;renderTop();if(S.view=='asks'&&g==S.gen)renderAsks()}).catch(()=>{});
    if(S.view=='tasks'){const d=await get('/api/tasks');if(g!=S.gen)return;S.tasks=d;renderTop()}
    else if(S.view=='causes'){const d=await get('/api/reflections');if(g!=S.gen)return;C.d=d;renderTop()}
    else if(S.view=='looks'){const d=await get('/api/looks?repo='+encodeURIComponent(S.repo));if(g!=S.gen)return;L.d=d;renderTop()}
    else if(S.view=='roadmap'){const d=await get('/api/roadmap?repo='+encodeURIComponent(S.repo));if(g!=S.gen)return;R.d=d;
      if(S.bead&&(!R.b||R.b.id!=S.bead||R.bt<Date.now()-15000)){const b=await get('/api/bead?repo='+encodeURIComponent(d.repo||S.repo)+'&id='+encodeURIComponent(S.bead));if(g!=S.gen)return;R.b=b;R.bt=Date.now()}}
    else if(S.view=='task'){const d=await get(`/api/task-timeline?repo=${encodeURIComponent(S.repo)}&id=${encodeURIComponent(S.task)}`);if(g!=S.gen)return;S.tl=d;
      if(S.block){const run=S.run||lastRun(d),r=runOf(d,run),live=!!(r&&r.end&&r.end.outcome=='running');
        if(r&&(!S.blk||live)){const b=await get(`/api/block?run=${encodeURIComponent(run)}&node=${S.block.node}&k=${S.block.k}`);if(g!=S.gen)return;S.blk=b;
          if(b.events_id&&(!S.events||live)){S.events=await get('/api/events?id='+encodeURIComponent(b.events_id)).catch(()=>[]);if(g!=S.gen)return}
          else if(!b.events_id)S.events=[]}}}
    render();if(S.view=='asks')await a;
  }catch(e){if(g==S.gen&&S.view!='asks'&&!S.tasks&&!S.tl)$('main').innerHTML=`<div class="list"><div class="empty"><b>The dashboard server did not answer</b>${esc(e.message)}</div></div>`}
  finally{busy=false}}
function loop(){setTimeout(async()=>{if(!document.hidden)await poll();loop()},2500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

// ---- render -------------------------------------------------------------------------------------------------------
function paint(el,key,html){if(S.sig[key]===html)return false;S.sig[key]=html;el.innerHTML=html;return true}
function render(){if(S.view=='roadmap')renderBead();if(S.view=='tasks')renderTasks();else if(S.view=='task')renderTask();else if(S.view=='roadmap')renderRoadmap();else if(S.view=='looks')renderLooks();else if(S.view=='causes')renderCauses();else renderAsks();renderDrawer()}
function lookCount(){if(L.d&&L.d.summary)return L.d.summary.open;const g=((R.d&&R.d.signals)||[]).find(x=>x.kind=='looks');return g?+(g.title.match(/\d+/)||[0])[0]:0}
function renderTop(){$('lookn').textContent=lookCount()||'';
  const open=(S.asks.asks||[]).filter(a=>!a.answered_here&&!a.parked).length;$('askn').textContent=open||'';
  if(S.tasks&&S.tasks.host)$('host').textContent=S.tasks.host;
  const out=(S.asks.delegate&&S.asks.delegate.out)||[];
  const det=(S.asks.delegate&&S.asks.delegate.detail)||{};
  paint($('lanes'),'lanes',out.map(n=>{const d=det[n]||{};
    return `<span class="lane" title="delegate says this lane is ${d.reason=='logged_out'?'logged out':'out'}"><i></i>${esc(d.text||laneName(n)+' out')}</span>`}).join(''))}
function laneName(n){n=String(n).toUpperCase();return n.includes('OPENAI')||n.includes('CODEX')?'Codex':n.includes('CLAUDE')?'Claude':n.toLowerCase()}

function matches(t){if(!S.q)return true;return (t.id+' '+t.title+' '+t.repo+' '+t.label+' '+t.slot).toLowerCase().includes(S.q.toLowerCase())}
function taskRow(t){const st=t.state||'';
  const when=st=='running'?`<b>for ${dur(t.since)}</b>`:`<b>${esc(ago(t.updated))}</b>`;
  const runs=(t.runs>1?t.runs+' runs · ':'')+dur(t.secs);
  return `<a class="task st-${esc(st)}" href="#task=${encodeURIComponent(t.id)}${t.repo?'&repo='+encodeURIComponent(t.repo):''}">
    <span class="sd"></span>
    <div style="min-width:0"><div class="t1">${esc(t.title||t.id)}</div>
      <div class="t2"><span class="mono">${esc(t.id)}</span>${t.repo?'<span>·</span><span>'+esc(t.repo)+'</span>':''}</div></div>
    <div class="stagecol">${chip(STATE[st]||'s-info',t.label||st)}</div>
    <div class="right">${when}<span>${t.slot?'<span class="slot">'+esc(t.slot)+'</span> · ':''}${esc(runs)}</span></div></a>`}
const GROUPS=[['Running',x=>x.state=='running'],['Waiting on you',x=>x.state=='asks'||x.state=='waiting'],['Paused, queued or blocked',x=>x.state=='paused'||x.state=='queued'||x.state=='blocked_by'],
  ['Stopped or failed',x=>['stopped','failed','blocked'].includes(x.state)],['Landed',x=>x.state=='landed'||x.state=='done']];
function renderTasks(){if(!S.tasks)return;
  const all=S.tasks.tasks,ts=all.filter(matches),n=f=>all.filter(f).length;
  const sum=[[n(GROUPS[0][1]),'running'],[n(GROUPS[1][1]),'waiting on you'],[n(GROUPS[2][1]),'paused'],[n(GROUPS[4][1]),'landed this week']].filter(x=>x[0]).map(x=>x[0]+' '+x[1]).join(' · ');
  let html=`<div class="hero"><div><h1>Tasks</h1><div class="sum">${esc(sum||'nothing ran this week')}</div></div>
    <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3.5 3.5"/></svg>
    <input id="q" type="search" placeholder="Filter tasks  /" value="${esc(S.q)}" autocomplete="off" aria-label="Filter tasks"></label></div>`;
  if(!all.length)html+=`<div class="list"><div class="empty"><b>No engine runs this week</b>Start one with <code>tl run-task &lt;bead&gt;</code> or <code>tl loop</code>; it shows here the moment it starts.</div></div>`;
  else if(!ts.length)html+=`<div class="list"><div class="empty"><b>Nothing matches “${esc(S.q)}”</b>Filter by bead id, title, repo or slot.</div></div>`;
  for(const [name,f] of GROUPS){const xs=ts.filter(f);if(!xs.length)continue;const cap=name=='Landed'&&!S.showAll&&!S.q?10:1e9;
    html+=`<section class="group"><h2>${esc(name)} <span class="n">${xs.length}</span></h2><div class="list">${xs.slice(0,cap).map(taskRow).join('')}
      ${xs.length>cap?`<button class="more" data-more="1">Show ${xs.length-cap} more</button>`:''}</div></section>`}
  const q=document.activeElement&&document.activeElement.id=='q',pos=q?document.activeElement.selectionStart:null;
  if(paint($('main'),'main',html)&&q){const i=$('q');i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}}

function whoLine(w){if(!w)return'';if(w.family=='engine')return'<span class="fam">Engine</span>';
  if(!w.name)return'<span class="fam" style="color:var(--faint)">no worker</span>';
  const bits=[model(w.model),effort(w.effort)].filter(Boolean).join(' · ');return `<span class="fam">${esc(w.name)}</span>${bits?'<span>· '+esc(bits)+'</span>':''}`}
function blockHtml(r,b){const w=b.who||{};const sel=S.block&&S.block.node==b.node&&S.block.k==b.k&&(S.run||lastRun(S.tl))==r.run;
  const tags=[];if(w.resumed)tags.push('<span class="tag" title="Resumed the previous writer\'s thread">resumed</span>');
  if(w.fallback&&!b.same_family)tags.push(`<span class="tag fb" title="${esc(w.fallback)}">${esc(w.fallback.indexOf('new thread')==0?'new thread':'fallback')}</span>`);
  const res=b.result||{};const meta=[dur(b.secs),tok(b.tokens)].filter(Boolean).join(' · ');
  const stg=b.stage_count?`<span class="tag stg" title="${esc(stageName(b))}">${b.stage_index}/${b.stage_count}</span>`:'';
  const sf=b.same_family?`<div class="bksf" title="${esc(SAMEFAM)}">same family as writer — weaker review</div>`:'';
  return `<button class="blk f-${esc(w.family||'engine')}${sel?' sel':''}" data-run="${esc(r.run)}" data-node="${b.node}" data-k="${b.k}" aria-label="${esc(b.label+(b.stage_count?', '+stageName(b):''))}: details">
    <div class="bk1"><span class="bkk">${esc(b.label)}</span>${stg}</div>
    <div class="bkw">${whoLine(w)}</div>${meta||tags.length?`<div class="bkm"><span>${esc(meta)}</span>${tags.join('')}</div>`:''}${sf}
    <div class="bkr">${chip('s-'+(res.status||'info'),res.text||'—')}</div></button>`}
const SAMEFAM='The reviewer is the same model family as the writer of this stage, usually because no other lane was free. A reviewer from the same family tends to share the writer\'s blind spots, so this review is weaker evidence.';
function stageName(b){return 'Stage '+b.stage_index+' of '+b.stage_count+(b.stage_title?' · '+b.stage_title:'')}
function secKey(b){return b.stage_count?'s'+b.stage_index+'/'+b.stage_count:b.kind!='land'&&b.kind!='verify'&&b.fix?'f'+b.fix:null}
function secHead(b){return b.stage_count?`<div class="sechd"><b>Stage ${b.stage_index} of ${b.stage_count}</b>${b.stage_title?`<span class="tt" title="${esc(b.stage_title)}">${esc(b.stage_title)}</span>`:''}</div>`:
  `<div class="sechd"><b>Fix round ${b.fix}${b.fixes?' of '+b.fixes:''}</b><span class="tt">after land</span></div>`}
function chainHtml(r){let out='',sec=null,inner='';const close=()=>{if(sec!==null)out+=`<div class="sec">${inner}</div></div>`;sec=null;inner=''};
  r.blocks.forEach((b,j)=>{const key=secKey(b),step=`<div class="step">${j?connHtml(b.arrow):''}${blockHtml(r,b)}</div>`;
    if(key!==sec){close();if(key!==null){sec=key;inner=secHead(b)+'<div class="chain">'}}
    if(sec!==null)inner+=step;else out+=step});
  close();return out+`<div class="step">${endHtml(r.end)}</div>`}
function connHtml(a){if(!a||!a.text)return '<div class="conn short c-info" aria-hidden="true"><span class="ln"></span></div>';
  return `<div class="conn c-${CAUSE[a.cause]||'info'}" title="${esc(a.detail||a.text)}"><span class="lbl">${esc(a.text)}</span><span class="ln"></span></div>`}
function endHtml(e){if(!e)return'';const cls={landed:'s-ok',done:'s-ok',asks:'s-ask',waiting:'s-ask',paused:'s-wait',running:'s-run'}[e.outcome]||'s-fail';
  const parts=(e.text||'').split(' → ');let lead='',pill=e.text||e.outcome;
  if(parts.length>1){lead=parts[0];pill=parts.slice(1).join(' → ')}
  if(e.outcome=='stopped'){lead='';pill='stopped'}
  const c=CAUSE[e.cause]||({asks:'ask',waiting:'ask',paused:'wait',landed:'ok',done:'ok',running:'info'}[e.outcome])||'fail';
  return (lead?`<div class="conn c-${c}" title="${esc(e.why||e.text)}"><span class="lbl">${esc(lead)}</span><span class="ln"></span></div>`:connHtml(null))+
    `<div class="endp ${cls}" title="${esc(e.why||e.text||'')}"><span class="d"></span>${esc(pill)}</div>`}
function renderTask(){const d=S.tl;if(!d||!d.task||d.task.id!=S.task){paint($('main'),'main',`<a class="back" href="#tasks">‹ Tasks</a><div class="loading">Loading ${esc(S.task)}…</div>`);return}
  const t=d.task,total=d.runs.reduce((s,r)=>s+(r.secs||0),0),toks=d.runs.reduce((s,r)=>s+((r.tokens||{}).in||0)+((r.tokens||{}).out||0),0);
  let html=`<a class="back" href="#tasks">‹ Tasks</a><div class="thead"><div style="flex:1;min-width:0"><h1>${esc(t.title||t.id)}</h1>
    <div class="tmeta"><span class="mono">${esc(t.id)}</span>${t.repo?'<span>'+esc(t.repo)+'</span>':''}${t.slot?'<span>slot <span class="slot">'+esc(t.slot)+'</span></span>':''}
    <span>${d.runs.length} run${d.runs.length==1?'':'s'}</span>${total?'<span>'+dur(total)+' in all</span>':''}${toks?'<span>'+tok({in:toks})+'</span>':''}</div></div>
    ${chip(STATE[t.state]||'s-info',t.label||t.state||'')}</div>`;
  if(t.ask)html+=askBox(Object.assign({bead:t.id},t.ask));
  if(d.runs.length)html+=`<div class="legend"><span><i style="background:var(--codex)"></i>Codex</span><span><i style="background:var(--claude)"></i>Claude</span><span><i style="background:var(--engine)"></i>Engine</span><span class="hint">click a step for its transcript, checks and log</span></div>`;
  else html+=`<div class="list"><div class="empty"><b>No engine runs for this task</b>Its runs show here once <code>tl run-task ${esc(t.id)}</code> starts one.</div></div>`;
  d.runs.forEach((r,i)=>{const bcls={answer:'b-answer',resume:'b-resume',retry:'b-retry'}[r.started_because]||'';
    const live=r.end&&r.end.outcome=='running';
    const meta=[hm(r.started)+(r.ended&&!live?'–'+hm(r.ended,true):''),dur(r.secs),tok(r.tokens)].filter(Boolean).join(' · ');
    html+=`<section class="run"><div class="rh"><span class="rn">Run ${i+1}</span><span class="because ${bcls}">${esc(r.because||r.started_because)}</span><span class="rt">${esc(meta)}</span></div>
      <div class="chain">${chainHtml(r)}</div></section>`});
  const ae=document.activeElement,keep=ae&&ae.tagName=='TEXTAREA'?[ae.dataset.ans,ae.value,ae.selectionStart]:null;
  if(paint($('main'),'main',html)&&keep){const ta=document.querySelector(`textarea[data-ans="${CSS.escape(keep[0])}"]`);if(ta){ta.value=keep[1];ta.focus();try{ta.setSelectionRange(keep[2],keep[2])}catch(e){}}}}

const ASKK={decision:'Decision needed',verify:'Please check',denied:'Blocked: a step needs you',budget:'Over its time limit',ticket:'Split or criteria needed',stuck:'Stuck: a hint is needed'};
const PEND={},DRAFT={},SEEN={},ERR={},AMEND={};  // PEND: ask id -> {ask,text,label,at,timer|sending|done|err}; DRAFT: unsent text; SEEN: asks as last drawn
const UNDO_MS=8000,STALE=['withdrawn','gone','answered','bead_missing','consumed'];
/*md*/function md(src){  // a small safe markdown: paragraphs, bullets, tables, **bold**, `code`; everything is escaped first, no links, no raw HTML
  const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const L=String(src==null?'':src).split('\n'),row=/^\s*\|.*\|\s*$/,sep=/^\s*\|[\s:|-]+\|\s*$/;let out='',i=0,ul=false;

      <div class="rail">${rail}</div>${l.verdict?`<div class="rverd">${esc(l.verdict)}</div>`:''}${hist?`<div class="rhist"><em>${l.trail.length>8?'last 8 of '+l.trail.length:'so far'}</em>${hist}</div>`:''}</a>${unl}</div>`}
function signalsHtml(d){const sg=d.signals||[];if(!sg.length)return '<div class="sigs"><div class="sig green"><b>Nothing wrong</b><span>no signal fires: no lane out, no churn, no cluster of parks, no old ask</span></div></div>';
  const card=s=>{const look=(s.look||[]).map(i=>`<a class="lk" href="${taskHref(i,d.repo)}" data-bead="${esc(i)}">${esc(shortId(i))}</a>`).join(' ');
    const t=s.href?`<a href="${esc(s.href)}">${esc(s.title)}</a>`:esc(s.title);
    return `<div class="sig ${esc(s.sev)}"><b>${t}</b><span>${esc(s.line)}</span>${look?`<span class="lks">${look}</span>`:''}</div>`};
  const head=sg.slice(0,6),rest=sg.slice(6);
  return `<div class="sigs">${head.map(card).join('')}</div>`+(rest.length?`<details class="sigmore" id="sigmore"${R.sigmore?' open':''}><summary>${rest.length} more signal${rest.length>1?'s':''}</summary><div class="sigs">${rest.map(card).join('')}</div></details>`:'')}
function queueHtml(q,repo,held){return `<div class="glog${held?' held':''}">`+q.map((b,i)=>`<div class="gc${i||held?'':' first'}${held?' nn':''}"><div class="h">${held?'':`<span class="n">${i+1}</span>`}
  <a class="tt" href="${taskHref(b.id,repo)}" data-bead="${esc(b.id)}">${esc(b.title||b.id)}</a>
  <span class="rs">${b.unblocks?`<span class="unb">unblocks ${b.unblocks}</span> `:''}<span class="mono">${esc(shortId(b.id))}</span>${b.priority!=null?' · P'+b.priority:''}${b.reason?' · '+esc(b.reason):''}${b.why?' · '+esc(b.why):''}</span></div>${rtree(b.tree,repo)}</div>`).join('')+'</div>'}
function renderRoadmap(){const d=R.d;if(!d)return;
  if(d.error){paint($('main'),'main',`<div class="list"><div class="empty"><b>${esc(d.error)}</b></div></div>`);return}
  const sm=d.summary||{},names=d.repos||[];
  const today=[[sm.landed,'landed','ok'],[sm.parked,'parked','ask'],[sm.failed,'failed','fail'],[sm.paused,'paused','wait']].filter(x=>x[0]).map(x=>`<span class="${x[2]}"><b>${x[0]}</b> ${x[1]}</span>`).join(' · ');
  let html=`<div class="hero"><div><h1>Roadmap</h1><div class="sum">${esc(d.repo)} · today ${today||'nothing finished yet'} · <b>${d.queue.length}</b> ready</div></div>
    <div class="rtools">${names.length>1?`<select id="rrepo" aria-label="Repo">${names.map(n=>`<option ${n==d.repo?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}</div></div>`;
  html+=signalsHtml(d);
  html+='<div class="rsec">Slots <small>finished passes, then the bead running now</small></div>';
  html+=d.lanes.length?d.lanes.map(l=>laneHtml(l,d.repo,d.loops_waiting)).join(''):`<div class="list"><div class="empty"><b>No loop is running on ${esc(d.repo)}</b>Start one with <code>tl loop</code>; its slots show here.</div></div>`;
  html+=`<div class="rsec">Up next <small>the order <code>tl next</code> takes. A branch is a bead that waits on the one above it.${d.loops_waiting?` ${d.loops_waiting} loop${d.loops_waiting>1?'s':''} wait${d.loops_waiting>1?'':'s'} for a free slot.`:''}</small></div>`;
  html+=d.queue.length?queueHtml(d.queue,d.repo):'<div class="list"><div class="empty"><b>Nothing ready</b>No open bead the loop may take.</div></div>';
  if(d.held&&d.held.length)html+=`<details class="rheld" id="rheld"${R.held?' open':''}><summary><div class="rsec">Held back <small>${d.held_total} ready but skipped for now: another bead holds their area</small></div></summary>${queueHtml(d.held,d.repo,true)}</details>`;
  if(paint($('main'),'main',html))tip.hidden=true}
document.addEventListener('change',e=>{if(e.target.id=='rrepo'){S.repo=e.target.value;R.d=null;history.replaceState(null,'','#roadmap&repo='+encodeURIComponent(S.repo));S.gen++;poll()}});
document.addEventListener('toggle',e=>{if(e.target.id=='rheld')R.held=e.target.open;if(e.target.id=='sigmore')R.sigmore=e.target.open},true);

// ---- hover card and bead panel: what is this ticket, what has it cost, what happened to it -------------------------
const tokh=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n||0);
function costLine(b,st){if(!b||!b.tok)return'';const m=(st||{}).median_fresh,x=m?b.fresh/m:0;
  return `${tokh(b.new_in)} new input + ${tokh(b.out)} output (${x>=1.5?x.toFixed(1)+'× the median bead ':''}median ${tokh(m||0)}) · ${tokh(b.cache)} cache reads`}
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.appendChild(tip);
let tipT=null;
function showTip(el){const id=el.dataset.bead,b=R.d&&R.d.briefs&&R.d.briefs[id];if(!b)return;
  const why=String(b.why||'').split('\n')[0].slice(0,150);
  tip.innerHTML=`<b>${esc(b.title||id)}</b><div class="tl2"><span class="mono">${esc(id)}</span>${b.priority!=null?' · P'+b.priority:''}${b.state?' · '+esc(b.state):''}</div>`
    +(why?`<div class="tl2">${esc(why)}</div>`:'')
    +(b.runs?`<div class="tl2">${b.runs} run${b.runs>1?'s':''} · ${b.blocks} steps · ${esc(dur(b.secs))}</div>`:'')
    +(b.tok?`<div class="tl2">${esc(costLine(b,R.d.stats))}</div>`:'')+'<div class="tl3">click for description, comments and history</div>';
  tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+'px';tip.style.top=(r.bottom+h+12>innerHeight?Math.max(8,r.top-h-8):r.bottom+6)+'px'}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-bead]');clearTimeout(tipT);
  if(!el){tip.hidden=true;return}tipT=setTimeout(()=>showTip(el),180)});
document.addEventListener('scroll',()=>{tip.hidden=true},true);
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-bead]');if(!el||S.view!='roadmap')return;
  if(e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();e.stopImmediatePropagation();tip.hidden=true;
  location.hash='roadmap&repo='+encodeURIComponent((R.d&&R.d.repo)||S.repo)+'&bead='+encodeURIComponent(el.dataset.bead)},true);
function closeBead(){location.hash='roadmap&repo='+encodeURIComponent((R.d&&R.d.repo)||S.repo)}
function when(t){if(!t)return'';const d=new Date(t);return isNaN(d)?String(t):d.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}
function histHtml(runs){return runs.map((r,i)=>{
  const bl=r.blocks.map(b=>`<div class="hb ${b.status=='ok'?'ok':b.status=='fail'?'fail':b.status=='run'?'run':''}"><span class="hk">${esc(b.label||b.kind)}${b.stage&&b.stages>1?' '+b.stage+'/'+b.stages:''}</span><span class="hr">${esc(b.text||'')}</span><span class="hs">${b.secs?esc(dur(b.secs)):''}${b.tokens&&(b.tokens.in||b.tokens.out)?' · '+tokh((b.tokens.in||0)-(b.tokens.cached||0)+(b.tokens.out||0)):''}</span>${b.arrow?`<span class="ha">↳ ${esc(b.arrow)}</span>`:''}</div>`).join('');
  return `<div class="hrun"><div class="hh"><b>Run ${i+1}</b> ${esc(r.because||'')} · ${esc(when(r.started*1000))} · ${esc(dur(r.secs))} · ${esc(r.end||'')}</div>${bl}</div>`}).join('')}
const TKIND={work:'Working',checks:'Checks',wait:'Waiting',idle:'Idle'};
function timeHtml(t){if(!t||!t.segments||!t.segments.length)return'';const T=t.totals,span=Math.max(1,t.t1-t.t0);
  const bar=t.segments.map(s=>`<i class="tk-${esc(s.kind)}" style="flex:${Math.max(s.secs,span/400)} 0 0" title="${esc(s.label+' · '+dur(s.secs)+(s.holder?' · held by '+s.holder:'')+' · '+hm(s.t0))}"></i>`).join('');
  const rows=['work','checks','wait','idle'].filter(k=>T[k]).map(k=>{const sub=Object.keys(T.by_what||{}).filter(w=>t.segments.some(s=>s.what==w&&s.kind==k)&&(k=='wait'||k=='idle'||(k=='checks'&&w!='checks')))
      .map(w=>[w,t.segments.filter(s=>s.what==w&&s.kind==k).reduce((a,s)=>a+s.secs,0)]).filter(x=>x[1]);
    return `<span class="sw tk-${k}"></span><span>${TKIND[k]}</span><b>${esc(dur(T[k]))}</b>`+(sub.length?`<div class="sub2"><span>${sub.map(x=>esc(x[0].replace(/_/g,' '))+' '+esc(dur(x[1]))).join(' · ')}</span></div>`:'')}).join('');
  return `<h3>Where the time went</h3><div class="tbar">${bar}</div><div class="tax"><span>${esc(hm(t.t0))}</span><span>${esc(dur(span))} start to ${t.segments.length&&t.t1>=t.now-5?'now':'end'}</span><span>${esc(hm(t.t1,true))}</span></div><div class="ttot">${rows}</div>`}
function renderBead(){const p=$('bpanel'),sc=$('bscrim');if(!p)return;const on=S.view=='roadmap'&&!!S.bead;p.classList.toggle('on',on);sc.classList.toggle('on',on);p.setAttribute('aria-hidden',on?'false':'true');
  if(!on)return;const b=R.b&&R.b.id==S.bead?R.b:null,br=R.d&&R.d.briefs&&R.d.briefs[S.bead];
  if(!b){paint(p,'bpanel',`<div class="bh"><div><h2>${esc((br&&br.title)||S.bead)}</h2><div class="sub mono">${esc(S.bead)}</div></div><button class="iconbtn x" data-bclose="1" aria-label="Close">${X}</button></div><div class="bb"><div class="loading">Loading…</div></div>`);return}
  const sec=(t,h)=>h?`<h3>${t}</h3>${h}`:'';
  const pre=t=>t?`<div class="pre">${esc(t)}</div>`:'';
  const cm=[...b.comments].reverse().map(c=>`<div class="cm"><div class="cmh"><b>${esc(c.author||'')}</b> <span>${esc(when(c.at))}</span></div><div class="pre">${esc(c.text||'')}</div></div>`).join('');
  const deps=b.deps.map(d=>`<div class="dp"><span class="mono">${esc(d.id)}</span> ${esc(d.title||'')} <span class="muted">${esc(d.status||'')}${d.type?' · '+esc(d.type):''}</span></div>`).join('');
  const tot=(b.runs||[]).reduce((a,r)=>a+((r.tokens&&r.tokens.in)||0),0);
  const cost=br&&br.tok?`<div class="cost"><b>${esc(costLine(br,R.d&&R.d.stats))}</b><span>${br.runs} run${br.runs>1?'s':''} · ${br.blocks} steps · ${esc(dur(br.secs))} in all</span></div>`:'';
  const why=br&&br.why?`<div class="why">${esc(String(br.why).split('\n')[0].slice(0,220))}</div>`:'';
  paint(p,'bpanel',`<div class="bh"><div style="min-width:0"><h2>${esc(b.title||S.bead)}</h2>
      <div class="sub"><span class="mono">${esc(b.id)}</span> · ${esc(b.status||'')}${b.priority!=null?' · P'+b.priority:''}${b.assignee?' · '+esc(b.assignee):''} ${(b.labels||[]).map(l=>`<span class="tag">${esc(l)}</span>`).join(' ')}</div></div>
      <button class="iconbtn x" data-bclose="1" aria-label="Close">${X}</button></div>
    <div class="bb">${why}${cost}${timeHtml(b.timeline)}${sec('Description',pre(b.description))}${sec('Acceptance criteria',pre(b.acceptance))}${sec('Design',pre(b.design))}${sec('Notes',pre(b.notes))}
      ${sec('Comments ('+b.comments.length+', newest first)',cm)}${sec('Transitions',histHtml(b.runs||[]))}${sec('Depends on',deps)}
      <a class="go" href="#task=${encodeURIComponent(b.id)}&repo=${encodeURIComponent((R.d&&R.d.repo)||S.repo)}">Open the full run timeline, transcripts and checks</a></div>`)}
document.addEventListener('click',e=>{if(e.target.closest('[data-bclose]')||e.target.id=='bscrim')closeBead()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.view=='roadmap'&&S.bead)closeBead()});

// ---- looks gallery: taste items from owner-look beads; "good" settles one, "redo" files a bead with the note ---------------
const L={d:null,busy:{},err:{},draft:{}};
const C={d:null};
function renderCauses(){const d=C.d;if(!d)return;const cs=d.clusters||[],rec=cs.filter(c=>c.recurring);
  let html=`<div class="hero"><div><h1>Causes</h1><div class="sum">last ${d.hours} h of run reflections · <b>${rec.length}</b> recurring · ${cs.length-rec.length} seen once</div></div></div>`;
  html+=cs.length?cs.map(c=>`<div class="lkc${c.recurring?'':' lkdone'}"><div><h3>${esc(c.title)}</h3><div class="lm"><span>${esc(c.cause)}</span><span>${c.runs} run${c.runs==1?'':'s'}</span>${c.bead?`<a class="mono" href="${taskHref(c.bead,c.repo?c.repo.split('/').pop():'')}">${esc(shortId(c.bead))}</a>`:(c.recurring?'<span>bead pending</span>':'')}</div></div>
    ${c.files.length?`<div class="lnote">${c.files.map(esc).join(' · ')}</div>`:''}<div class="lm">${(c.beads||[]).map(b=>`<a class="mono" href="${taskHref(b,'')}">${esc(shortId(b))}</a>`).join(' ')}</div></div>`).join(''):'<div class="list"><div class="empty"><b>No reflection in the window</b>Every run since 0.23.25 writes one; recurring causes become a bead each day (tl reflect digest).</div></div>';
  paint($('main'),'main',html)}
const lkKey=i=>i.look_bead+'|'+i.id;
function lkPics(i){const by={};i.shots.forEach(s=>{(by[s.label||s.path]=by[s.label||s.path]||{})[s.role]=s});
  const figs=[];Object.keys(by).forEach(k=>['before','after'].forEach(r=>{const s=by[k][r];if(s)figs.push(`<figure><a href="${esc(s.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(s.url)}" alt="${esc(r+': '+k)}" onerror="this.outerHTML='<div class=nopic>picture not in this checkout</div>'"></a><figcaption><b>${r}</b>${esc(k)}</figcaption></figure>`)}));
  return figs.length?`<div class="pics">${figs.join('')}</div>`:'<div class="nopic">no pictures were kept for this item</div>'}
function lkCard(i,repo){const k=lkKey(i),ans=i.status!='open',e=L.err[k];
  const res=ans?`<div class="res"><span>${i.status=='good'?'Marked good':'Redo asked: <a href="'+taskHref(i.redo_bead,repo)+'">'+esc(shortId(i.redo_bead||''))+'</a>'+(i.answer_note?' · '+esc(i.answer_note):'')}</span><button data-lk="undo" data-k="${esc(k)}"${L.busy[k]?' disabled':''}>Undo</button></div>`:
    `<div class="acts"><button class="good" data-lk="good" data-k="${esc(k)}"${L.busy[k]?' disabled':''}>Good</button><textarea data-lkn="${esc(k)}" rows="1" placeholder="What should change? (needed for Redo)">${esc(L.draft[k]||'')}</textarea><button class="redo" data-lk="redo" data-k="${esc(k)}"${L.busy[k]?' disabled':''}>Redo</button></div>`;
  return `<div class="lkc${ans?' lkdone':''}"><div><h3>${esc(i.title||i.id)}</h3><div class="lm"><a class="mono" href="${taskHref(i.bead,repo)}">${esc(i.bead)}</a><span>${i.filed?esc(ago(i.filed)):''}</span></div></div>
    ${i.note?`<div class="lnote">${esc(i.note)}</div>`:''}${lkPics(i)}${res}${e?`<div class="res err">${esc(e)}</div>`:''}</div>`}
function renderLooks(force){const d=L.d;if(!d)return;const sm=d.summary||{},names=d.repos||[];
  let html=`<div class="hero"><div><h1>Looks</h1><div class="sum">${esc(d.repo||'')} · <b>${sm.open||0}</b> wait for you · ${sm.good||0} good · ${sm.redo||0} redo</div></div>
    <div class="rtools">${names.length>1?`<select id="lrepo" aria-label="Repo">${names.map(n=>`<option ${n==d.repo?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}</div></div>`;
  html+=d.items.length?d.items.map(i=>lkCard(i,d.repo)).join(''):'<div class="list"><div class="empty"><b>No look waits for you</b>Taste items the loop could not judge from a picture land here, with before and after.</div></div>';
  const keep=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.lkn;
  if(keep&&!force)return;  // typing a note: leave the page alone
  const k=keep,at=k&&document.activeElement.selectionStart;
  if(paint($('main'),'main',html)&&k){const t=document.querySelector(`textarea[data-lkn="${CSS.escape(k)}"]`);if(t){t.focus();try{t.setSelectionRange(at,at)}catch(e){}}}}
async function lkSend(k,verdict){const i=(L.d.items||[]).find(x=>lkKey(x)==k);if(!i||L.busy[k])return;
  const ta=document.querySelector(`textarea[data-lkn="${CSS.escape(k)}"]`),note=(ta?ta.value:L.draft[k]||'').trim();
  if(verdict=='redo'&&!note){ta&&ta.focus();L.err[k]='Write what to change first.';S.sig={};renderLooks(true);return}
  delete L.err[k];L.busy[k]=1;S.sig={};renderLooks();
  let tk='';try{tk=localStorage.getItem('tl.token')||''}catch(e){}
  const r=await fetch('/api/look',{method:'POST',headers:{'Content-Type':'application/json',...(tk?{'Authorization':'Bearer '+tk}:{})},body:JSON.stringify({repo:L.d.repo,look_bead:i.look_bead,item:i.id,verdict,note})}).catch(()=>null);
  delete L.busy[k];
  if(!r)L.err[k]='The dashboard did not answer. Nothing was changed.';
  else if(r.status==401)L.err[k]='This address needs the answer link. Run tl dash url in a terminal and open the ANSWER LINK it prints.';
  else if(!r.ok){const j=await r.json().catch(()=>({}));L.err[k]=j.error||'Failed. Nothing was changed.'}
  else{delete L.draft[k];const j=await r.json().catch(()=>({}));i.status=j.status||i.status}
  S.sig={};await poll();renderLooks()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-lk]');if(b&&S.view=='looks')lkSend(b.dataset.k,b.dataset.lk)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.lkn)L.draft[e.target.dataset.lkn]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id=='lrepo'){S.repo=e.target.value;L.d=null;history.replaceState(null,'','#looks&repo='+encodeURIComponent(S.repo));S.gen++;poll()}});


// ---- events -------------------------------------------------------------------------------------------------------
document.addEventListener('click',e=>{const b=e.target.closest('.blk');if(b){openBlock(b.dataset.run,+b.dataset.node,+b.dataset.k);return}
  if(e.target.closest('[data-close]')||e.target.id=='scrim'){closeDrawer();return}
  const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;const h=new URLSearchParams(location.hash.slice(1));h.set('tab',S.tab);history.replaceState(null,'','#'+h);renderDrawer();return}
  const u=e.target.closest('[data-undo]');if(u){undoAnswer(u.dataset.undo);return}
  const am=e.target.closest('[data-amend]');if(am){AMEND[am.dataset.amend]=true;repaintAsks();return}
  const cl=e.target.closest('[data-clear]');if(cl){clearAsk(cl.dataset.clear);return}
  const dm=e.target.closest('[data-dismiss]');if(dm){dismissAsk(dm.dataset.dismiss);return}
  const s=e.target.closest('[data-send]');if(s){const ta=document.querySelector(`textarea[data-ans="${CSS.escape(s.dataset.send)}"]`);sendAnswer(s.dataset.send,'your answer',ta&&ta.value);return}
  const op=e.target.closest('[data-opt]');if(op){pickOption(op);return}
  if(e.target.closest('[data-more]')){S.showAll=true;renderTasks()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;renderTasks()}});
document.addEventListener('keydown',e=>{const tag=(document.activeElement||{}).tagName;
  if(e.key=='Escape'&&S.block){e.preventDefault();closeDrawer()}
  if(e.key=='/'&&S.view=='tasks'&&tag!='INPUT'&&tag!='TEXTAREA'){const q=$('q');if(q){e.preventDefault();q.focus()}}});
route();loop();
</script>
