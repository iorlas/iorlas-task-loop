# The root config plus: starting a process is a capability (a Spawner, contracts/ports.py), so this layer never imports subprocess.
extend = "../../../ruff.toml"
src = ["../..", "../../../packages/dash/src"]  # shell and dashboard imports are first party

[lint.flake8-tidy-imports.banned-api]
"delegate.app".msg = "task-loop imports delegate.api and nothing else of delegate"
"delegate.cli".msg = "task-loop imports delegate.api and nothing else of delegate"
"delegate.adapters".msg = "task-loop imports delegate.api and nothing else of delegate"
"delegate.domain".msg = "task-loop imports delegate.api and nothing else of delegate"
"delegate.contracts".msg = "task-loop imports delegate.api and nothing else of delegate"
"delegate.entry".msg = "task-loop imports delegate.api and nothing else of delegate"
"subprocess".msg = "app and cli start a process through the Spawner handed down from the edge (contracts/ports.py), never subprocess"
