<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task loop dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="dash.css">
  <script type="module" src="app.js"></script>
</head>
<body class="h-screen overflow-hidden bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div class="flex h-full flex-col">
    <header class="flex items-center gap-4 border-b border-slate-200 bg-white px-5 py-2.5 dark:border-slate-800 dark:bg-slate-900">
      <h1 class="text-sm font-semibold tracking-tight">Task loop</h1>
      <span id="summary" class="text-xs text-slate-500 dark:text-slate-400"></span>
      <div class="ml-auto flex items-center gap-3">
        <span id="mode"></span>
        <div class="flex gap-0.5 rounded-md bg-slate-100 p-0.5 dark:bg-slate-800" role="group" aria-label="Board layout">
          <button id="view-columns" type="button">Steps</button>
          <button id="view-lanes" type="button">By slot</button>
        </div>
        <button id="theme" type="button" class="rounded border border-slate-200 px-2.5 py-1 text-xs text-slate-600 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800">Theme</button>
      </div>
    </header>
    <main id="board" class="grid min-h-0 flex-1 grid-cols-7 gap-x-3 gap-y-2 overflow-x-auto p-4" style="min-width:1100px"></main>
  </div>
  <div id="backdrop" class="pointer-events-none fixed inset-0 z-40 bg-slate-900/20 opacity-0 transition-opacity duration-200 dark:bg-black/40"></div>
  <aside id="drawer" class="fixed inset-y-0 right-0 z-50 flex w-[64rem] max-w-full translate-x-full flex-col border-l border-slate-200 bg-white shadow-2xl transition-transform duration-300 dark:border-slate-800 dark:bg-slate-900"></aside>
</body>
</html>
