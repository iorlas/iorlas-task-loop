<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task loop dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="dash.css">
  <script type="module" src="app.js"></script>
</head>
<body class="h-screen overflow-hidden bg-slate-100 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">
  <div class="flex h-full flex-col">
    <header class="flex items-center gap-4 border-b border-slate-200 bg-white/80 px-5 py-3 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80">
      <h1 class="text-base font-semibold tracking-tight">🔁 Task loop</h1>
      <span id="summary" class="text-sm text-slate-500 dark:text-slate-400"></span>
      <div class="ml-auto flex gap-0.5 rounded-md bg-slate-200/70 p-0.5 dark:bg-slate-800" role="group" aria-label="Board layout">
        <button id="view-columns" type="button">Steps</button>
        <button id="view-lanes" type="button">By slot</button>
      </div>
      <span id="mode" class="rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-800 dark:bg-amber-400/15 dark:text-amber-300"></span>
      <button id="theme" type="button" title="Switch theme" class="rounded-md border border-slate-200 px-2 py-1 text-sm hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">🌓</button>
    </header>
    <main id="board" class="grid min-h-0 flex-1 grid-cols-7 gap-3 overflow-x-auto p-4" style="min-width:1100px"></main>
  </div>
  <div id="backdrop" class="z-40 pointer-events-none fixed inset-0 bg-slate-900/20 opacity-0 transition-opacity duration-200 dark:bg-black/40"></div>
  <aside id="drawer" class="z-50 fixed inset-y-0 right-0 flex w-[56rem] max-w-full translate-x-full flex-col border-l border-slate-200 bg-white shadow-2xl transition-transform duration-300 dark:border-slate-800 dark:bg-slate-900"></aside>
</body>
</html>
