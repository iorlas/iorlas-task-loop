<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>task-loop kit</title>
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/kit.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/phone.css">
<style>
.kitf{display:flex;flex-wrap:wrap;gap:16px;padding:16px;align-items:flex-start}.kitf figure{margin:0;max-width:100%}.kitf figcaption{font-size:13px;color:var(--mut);margin-bottom:4px}
.kitf iframe{border:1px solid var(--line);border-radius:12px;max-width:100%;display:block}
.kit{padding:8px 16px 24px}.kit-i{border-top:1px solid var(--line);padding:10px 0}.kit-i h3{font-size:13px;margin:0 0 8px;font-weight:600}.kit-i h3 small{font-weight:400;color:var(--mut);font-size:12px}
.kit .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.kit .col{display:flex;flex-direction:column;gap:8px}.kit .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.kit .sw{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}.kit .sw span{display:inline-flex;align-items:center;gap:5px}.kit .sw i{width:20px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line)}
.kit .lines .trk{position:relative;height:30px}.kit .lines .ln{top:4px}
.kit-frame{position:relative;height:200px;overflow:hidden;transform:translateZ(0);border:1px dashed var(--line);border-radius:10px}.kit-frame .drw{width:min(420px,90%)}
.kit-p{margin:0;font-size:13px}.kit .nav{gap:2px}
</style></head><body><div id="root"></div><script type="module" src="js/components.js"></script></body></html>
