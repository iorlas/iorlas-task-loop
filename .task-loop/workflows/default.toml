# The default workflow: each agent step's prompt, in order. The factory appends its contract after these sections
# (answer rules, plan template and caps, Git and commit limits); it is not written here.

[[step.plan.prompt]]
text = """\
First assess depth from the supplied task text alone, before any exploration or reading. \
State the depth in your first commentary message so the dashboard conversation shows it for owner correction. \
The only optional cheap check is at most one search for identifiers named in the task, returning only a count of files and opening nothing. \
Do not read source, an existing plan, glossary, tracker or history before this assessment.

Apply these depth rules in order, using only facts in the task text:
- Large: more than 3 independent behaviours, or a schema version change, or an explicitly unlanded task dependency, or more than 60 named files.
- Otherwise medium: 2 to 3 behaviours, or changes in 2 to 3 owning modules.
- Otherwise small: one behaviour in one owning module.
Three behaviours meet the medium rule; four meet the large rule. 60 named files do not trigger large; 61 do. \
A large trigger takes precedence over medium or small. \
Give a one-sentence reason, state whether an owner decision is missing or a dependency is unlanded, and state the evidence-gathering budget in model calls: small 6, medium 12, large 20. \
These are total evidence ceilings, not additional calls per search or file, and are distinct from the Size estimate for an implement attempt. \
Finish within the budget using bounded evidence; a budget alone is not an owner-refusal cause.

Before exploring, answer `needs_owner` for exactly these three early causes:
- Large work with independent parts: propose a split in words, each part with a name, independently testable acceptance criterion and dependencies (explicitly none where appropriate).
- A missing owner decision: identify the decision and what the owner must resolve.
- An explicitly unlanded dependency named in the task: identify the dependency and what must land first.
For each early refusal, put `# Depth`, the assessment and concrete reason in `explanation`, within 2000 characters; write no new plan and offer no commit: use `paths: []`, `message: null`, and the expected or null `plan_path`. \
Preserve existing saved work. \
The owner or orchestrator creates split tasks; do not create them or ask the owner to run a CLI command. \
Do not infer a missing decision from terse wording or treat a reference to another task as proof it is unlanded. \
A large classification alone is not an early refusal cause. \
A single cohesive schema change may be large and still receive a bounded plan when none of these causes applies. \
Later refusal for actual contradictions or infeasibility and the separate Size limits still apply; they are not additional early causes.

If the assessment permits planning, only then read the existing plan and gather bounded evidence. \
Within that evidence budget, inspect existing implementations and supplied overlapping-task information before proposing remaining work. \
Use the supplied task discussion; do not require tracker access. \
Identify what is already delivered and the remaining gap; avoid duplicating delivered work. \
Overlap alone establishes neither a missing owner decision nor an explicitly unlanded dependency. \
Planning is never skipped: a small task gets a short plan. \
Put depth, reason, decision/dependency status, evidence budget and the Size estimate in Header; do not add separate Depth or Size sections. \
Reusing an existing plan requires both current assessments in Header; an existing plan without them needs revision, not `unchanged`. \
Use the included glossary excerpt at every depth; collect missing terms into at most one targeted glossary read, after the assessment permits planning. \
Depth is plain English: add no glossary term or new stage."""

[[step.plan.prompt]]
text = """\
AGENTS.md is already in context: follow it without reading it again. \
These attempt-specific directions replace its general orientation-file read instructions. \
The supplied task text is the complete task specification. \
No task tracker lookup is required: use the supplied task text. \
Do not invoke bd (including bd prime or bd show) or load the beads SKILL.md. \
Do not search git log with the task id as a grep pattern: it supplies no further spec. \
Do not read the justfile or .task-loop.json: the check commands below replace instructions to read those files. \
Listing checks does not require a plan attempt to run implementation checks. \
Use the included glossary definitions; read the full glossary only for missing terms, collected into at most one targeted read command per attempt. \
Do not start by reading it in full. \
Read the task's own plan as this step requires; read an older foundation plan only if the task's own plan cites it. \
If no glossary exists at the source commit, do not search for one."""

[[step.plan.prompt]]
use = "task"

[[step.plan.prompt]]
use = "input_context"

[[step.plan.prompt]]
text = """\
After the depth assessment permits planning, follow this plan-only reading order. \
These rules supersede the shared foundation-read condition:
1. \
AGENTS.md rules are already in context; follow them without reopening the file.
2. \
Use the supplied glossary excerpt; collect missing terms into at most one targeted read of `docs/glossary.md`. \
If no glossary exists at the source commit, do not search for one.
3. \
After the depth assessment permits planning, read the existing plan file named in the closing rules below, if it exists.
4. \
Read a foundation plan only when the task text names it.
For this list, read each of these once; never read a file twice. \
Then gather only the source evidence needed for the task.

Search with an explicit repository path scope and a count first (`rg -c`) before printing matching lines. \
Do not search outside the repository, including task-loop state, ~/.codex or the uv cache. \
An output marked truncated means the search was too wide: narrow the scope or range; do not repeat the same command or increase the output limit. \
For shelf facts, use the supplied shelf digest from .186; do not discover an installed shelf package outside the repository or invent missing digest contents. \
If a necessary shelf fact is absent, answer `needs_owner` and explain the missing fact in words.

"""

[[step.plan.prompt]]
text = """\
Before answering `planned` or `unchanged`, require a Size estimate in Header with estimated changed files (including tests and artifacts), independent behaviours, and model calls for one implement attempt. \
Each independent behaviour must have an independently testable acceptance criterion; file count alone is insufficient. \
An existing plan without this assessment needs revision, not `unchanged`. \
An existing plan missing `## Read list` needs revision before answering `planned` or `unchanged`. \
Reassess the existing Header Size estimate against the current requirements and code before reusing it. \
If any estimate exceeds 60 files, 3 independent behaviours or 100 model calls, answer `needs_owner`, never `planned` or `unchanged`. \
Equality is allowed (60 files, 3 behaviours, 100 calls); 61 files, 4 behaviours or 101 calls each suffice for refusal. \
Low file count cannot excuse another excess. \
Put the reason and proposed split in `explanation`, within its existing 2000-character limit: each part must have a name, acceptance criterion and dependencies (explicitly none where appropriate). \
The owner or orchestrator creates the parts in the task tracker; do not create them or ask the owner to run a CLI command. \
On refusal, write no new successful plan and offer no commit: use `paths: []`, `message: null`, and the expected or null `plan_path`. \
Preserve existing saved work; a draft is not approval to implement."""

[[step.implement.prompt]]
text = """\
AGENTS.md is already in context: follow it without reading it again. \
These attempt-specific directions replace its general orientation-file read instructions. \
The supplied task text is the complete task specification. \
No task tracker lookup is required: use the supplied task text. \
Do not invoke bd (including bd prime or bd show) or load the beads SKILL.md. \
Do not search git log with the task id as a grep pattern: it supplies no further spec. \
Do not read the justfile or .task-loop.json: the check commands below replace instructions to read those files. \
Listing checks does not require a plan attempt to run implementation checks. \
Use the included glossary definitions; read the full glossary only for missing terms, collected into at most one targeted read command per attempt. \
Do not start by reading it in full. \
Read the task's own plan as this step requires; read an older foundation plan only if the task's own plan cites it. \
If no glossary exists at the source commit, do not search for one."""

[[step.implement.prompt]]
use = "task"

[[step.implement.prompt]]
use = "input_context"

[[step.implement.prompt]]
text = """\
Read the plan named in the closing rules below first. \
Immediately after reading the plan, reassess scope before broad exploration or editing. \
Read its `## Read list` by the stated line ranges before exploring other files. \
Search with `rg -n` and read only needed ranges; targeted searches for omitted callers or source that changed after planning are allowed. \
Do not `cat` a file over 300 lines. \
Before any `cat` of a file over 150 lines, run `rg -n '^def |^class '` on it and use range reads, even if the symbol search is empty. \
Do not batch whole-file dumps. \
Do not read a file again within this session unless it changed since you last read it; then read only the changed range, including verification after an edit. \
Keep enough location information from the first read to edit without reopening unchanged content. \
If the work needs more than about 60 model calls or touches more than 60 files, stop after the first coherent part, commit nothing extra, and answer `needs_owner` with the proposed split. \
If the excess is evident before editing, answer then; do not begin a part just to have something to save. \
If discovered during work, stop at the first coherent boundary without proceeding into another work package. \
Explain completed and remaining scope and propose named parts, each with an acceptance criterion and dependencies (explicitly none where appropriate). \
Partial work is unfinished: use `needs_owner`, `message: null`; the hold saves it. \
The owner or orchestrator creates parts in the task tracker; do not create them or ask the owner to run a CLI command. \
The plan's 100 estimated model calls limit is distinct from this implement reassessment at about 60 calls; these are scope instructions, not harness call quotas. \
The 60-file stop is earlier than the existing 96-path safety ceiling. \
Within this scope, implement the plan, with tests for the behavior it adds or changes."""

[[step.implement.prompt]]
text = """\
The factory ran this repository's `setup` before you started; uv normally uses the prepared cache offline. \
For an authorized shelf package addition or upgrade, acquisition of its latest release is allowed when absent from the prepared cache. \
While working, run only focused test files for the code you changed. \
For lint and type validation, run `just check 2>&1 | tail -60` at most twice while working, in addition to the required final run. \
Do not run a full `just test` while working. \
The only direct pytest invocation permitted is `uv run --frozen --no-sync python -I -m pytest -q <file> --tb=short | tail -40`, replacing `<file>` with a focused test file for your change. \
Do not invoke ruff or pyrefly directly, or use another direct pytest command. \
After finishing edits and focused verification, run `just check 2>&1 | tail -60` once and then `just test 2>&1 | tail -40` once, as the last validation before the answer, including an `unchanged` answer. \
Run the final `just test` once in the foreground with sufficient command wait time; never start it in the background or poll a running `just test`. \
Do not rerun either successful final command. \
If a command fails, fix the reported failure, use focused verification as needed, and rerun only the failed command; failure does not justify repeating the successful one. \
This failure exception overrides the normal run limits. \
Enable pipeline failure propagation in the command shell (`set -o pipefail`) so `tail` cannot conceal a failed check or test. \
Report the underlying command's result, not just `tail`'s status. \
These factory instructions take precedence over AGENTS.md's "Do not run whole-suite/live tests as an agent" for the two required final checks, once each, with the stated failure exception. \
This narrow exception does not authorize other whole-suite or live tests. \
Keep line length at most 140 (`E501`), at most six returns per function (`PLR0911`), and no function-local imports (`PLC0415`). \
In `explanation`, name the result of each final command. \
Temporary files go to `$TMPDIR`; cleanup is attempted after release and required before the next agent. \
Do not write elsewhere outside the repository. \
Your runs are evidence for you: after this step the checks run again outside your control, and only those results count. \
First confirm that `apply_patch` is offered in your implement tool set. \
Make every file edit with `apply_patch`, never with a Python or sed script. \
This includes additions, deletions and repairs; do not rewrite repository files with shell redirection. \
The project interpreter is `.venv/bin/python`; use `uv run --frozen --no-sync python -I` for execution or inspection scripts, never for file edits. \
Bare `python3` is the host's Python 3.12, not the project's Python 3.15. \
Only if `apply_patch` is absent, report the tool gap in `explanation` only and retain heredoc edits with the bounded verification above."""

[[step.feedback]]
text = """\
Failed check
The factory's check failed. Fix the reported failure and run the checks before answering."""
