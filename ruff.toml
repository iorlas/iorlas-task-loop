# Retained lint policy, scoped to the successor's actual source roots.
target-version = "py315"
src = ["src"]
line-length = 140
output-format = "concise"
exclude = [".worktrees", ".slots", ".task"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "C90", "SIM", "RUF", "PL", "D100", "TID251"]
ignore = ["PLR0913", "PLR2004", "PLR0917"]

[lint.mccabe]
max-complexity = 12

[lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Process mechanisms belong to their owning shared library."
