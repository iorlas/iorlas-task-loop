# Retained lint policy, scoped to the successor's actual source roots.
target-version = "py315"
src = ["src"]
line-length = 140
output-format = "concise"
exclude = [".worktrees", ".slots", ".task"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "C90", "SIM", "RUF", "PL", "D100", "TID251"]
ignore = ["PLR0913", "PLR2004", "PLR0917"]

[lint.mccabe]
max-complexity = 12

[lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Process mechanisms belong to their owning shared library."
"sqlite3".msg = "SQLite and connection types belong to literal store.py modules."

[lint.per-file-ignores]
# Test fixtures use SQLite directly; test_sqlite_contracts independently checks other banned APIs.
"tests/**" = ["TID251"]
# Literal stores and exact, shrinking connection-import exceptions from .importlinter.
