# Lint (88 sec 6). `just check` runs `ruff check`; `ruff format` applies to src/ only (see justfile).
target-version = "py312"
line-length = 140
output-format = "concise"
exclude = [".worktrees", ".slots", ".task", "tests/fixtures", "src/*/_vendor", "skills/task-loop/_vendor"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "C90", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913",  # argument count: deep functions legitimately take many
    "PLR2004",  # magic values
    "PLR0917",  # positional-argument count, same reason as PLR0913
]

# No per-file ignores, none for tests, skills or dev either: tests/gate_rules.py fails if one comes back. A genuine boundary gets one
# `# noqa: RULE  reason` on its own line (E402 after a sys.path edit, F401 for an import kept for its side effect, PLC0415, SIM115).

[lint.mccabe]
max-complexity = 12

