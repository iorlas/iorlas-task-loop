# Type checking (88 sec 6). `just check` runs `pyrefly check`; there is no baseline (tests/rules/gate_rules.py).
python-version = "3.15"
project-includes = ["src", "skills", "tests", "dev"]
# Vendored copies are byte-identical to their source repos and checked there; this repo only imports them.
project-excludes = ["**/_vendor/**"]
# `import tl` (the launcher, in tests) resolves through skills/task-loop; tests import their own helpers by bare name.
search-path = ["src", "skills/task-loop", "skills/task-loop/_vendor", "tests", "tests/stores", "dev"]
check-unannotated-defs = true
# Off: pyrefly matches .gitignore against absolute paths, so under .claude/worktrees/ it would match no file and pass.
use-ignore-files = false

# playwright is installed only on a machine that runs the cockpit screenshot scenario; it is the one real third-party import.
[[sub-config]]
matches = "tests/cockpit_scenario.py"
[sub-config.errors]
missing-import = false

# New code is strict from its first commit (88 D10); A sub-config cannot take
# `preset`, so the kinds the strict preset adds are spelled out.
[[sub-config]]
matches = "src/**"
[sub-config.errors]
implicit-any-parameter = "error"
implicit-any-empty-container = "error"
implicit-any-lambda = "error"
implicit-any-attribute = "error"
missing-override-decorator = "error"
method-assign = "error"
non-exhaustive-match = "error"
