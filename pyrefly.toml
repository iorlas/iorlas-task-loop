# Type checking (88 sec 6). `just check` runs `pyrefly check`; the baseline may only shrink (tests/test_rules.py).
python-version = "3.12"
project-includes = ["src", "skills", "tests", "dev"]
# Flat sibling imports (`import tl`) resolve through skills/task-loop; tests import their own helpers by bare name.
# C1 adds "src" here with the first file under src/ (pyrefly warns on a search-path entry that does not exist).
search-path = ["skills/task-loop", "tests", "dev"]
check-unannotated-defs = true
# Off: pyrefly matches .gitignore against absolute paths, so under .claude/worktrees/ it would match no file and pass.
use-ignore-files = false
baseline = "pyrefly-baseline.json"

# playwright is installed only on a machine that runs the cockpit screenshot scenario; it is the one real third-party import.
[[sub-config]]
matches = "tests/cockpit_scenario.py"
[sub-config.errors]
missing-import = false

# New code is strict from its first commit (88 D10); only the old flat files carry the baseline. A sub-config cannot take
# `preset`, so the kinds the strict preset adds are spelled out.
[[sub-config]]
matches = "src/**"
[sub-config.errors]
implicit-any-parameter = "error"
implicit-any-empty-container = "error"
implicit-any-lambda = "error"
implicit-any-attribute = "error"
missing-override-decorator = "error"
method-assign = "error"
