# Dev tools, pinned exactly. Install: `mise install`. Local gates verify the external-tool pins.
# The successor is installed as a wheel; package dependencies are declared in pyproject.toml.
[vars]
# Git is a system prerequisite, installed separately; mise does not manage it. This is a floor: newer is fine.
git_min_version = "2.54.0"

[tools]
"aqua:tailwindlabs/tailwindcss" = "4.1.11"
"aqua:gastownhall/beads" = "1.3.1"
just = "1.58.0"
prek = "0.3.6"
uv = "0.13.0"
gitleaks = "8.30.1"
