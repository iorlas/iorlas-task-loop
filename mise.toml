"aqua:gastownhall/beads" = "1.3.1"
just = "1.58.0"
prek = "0.3.6"
uv = "0.13.0"
ruff = "0.17.2"
"pipx:pyrefly" = "1.4.0"
"pipx:import-linter" = "2.15"
