# Dev tools, pinned exactly (88 sec 6). Install: `mise install`. The justfile reads these pins; CI installs the same versions with uv.
# Runtime needs none of them: the plugin runs through `uv run --script`, which installs its one dependency (msgspec) from the PEP 723 headers.
[tools]
"aqua:gastownhall/beads" = "1.3.1"
just = "1.58.0"
prek = "0.3.6"
uv = "0.13.0"
ruff = "0.17.2"
"pipx:pyrefly" = "1.4.0"
"pipx:import-linter" = "2.15"
