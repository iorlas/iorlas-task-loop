name: test
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # Fixtures are compared byte for byte; Windows git would turn their LF into CRLF on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The suite shells out to `just` (recipe checks); the developer machine has it, a runner does not.
      - uses: extractions/setup-just@v2
      # engine.dry_check runs subprocess.run(["bash", "-n"]); CreateProcess finds C:\Windows\System32\bash.exe (the WSL stub, no
      # distro installed) before Git Bash on PATH, so every plan check looked like a syntax error. Remove this step once dry_check
      # resolves bash with shutil.which.
      - name: Move the WSL bash stub out of the way (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          takeown /f C:\Windows\System32\bash.exe
          icacls C:\Windows\System32\bash.exe /grant "$($env:USERNAME):F"
          Rename-Item C:\Windows\System32\bash.exe bash.exe.off
      - run: python -m unittest discover -s tests -v
