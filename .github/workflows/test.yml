name: test
on: [push, pull_request]

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (ubuntu-latest, 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.0"
      # The suite shells out to `just` (recipe checks); the developer machine has it, a runner does not.
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      # pytest and xdist from uv.lock; Python 3.15 from .python-version. The serial group runs alone after the parallel workers.
      - run: uv run --frozen pytest -n auto -m "not serial"
      - run: uv run --frozen pytest -m serial

  # ruff and pyrefly, pinned in mise.toml and run by the same recipes as a local `just check`; nothing here needs a secret.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.0"
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just lint types rules
