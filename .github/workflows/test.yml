name: test
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The suite shells out to `just` (recipe checks); the developer machine has it, a runner does not.
      - uses: extractions/setup-just@v2
      - run: python -m unittest discover -s tests -v
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v2
      - name: probe bash and just
        shell: bash
        continue-on-error: true
        run: |
          which -a bash || true
          bash --version | head -1
          echo 'test -f a.txt' | bash -n; echo "bash -n rc=$?"
          just --version
      - name: probe Windows bash on cmd path
        if: runner.os == 'Windows'
        shell: cmd
        continue-on-error: true
        run: |
          where bash
          echo test -f a.txt | bash -n
          echo rc=%ERRORLEVEL%
      - name: probe LoudBind (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          time (lsof -nP -iTCP@203.0.113.9:50000 -sTCP:LISTEN -t; echo "lsof rc=$?")
          export TASK_LOOP_DASH_DEV_PUBLIC=1 XDG_CONFIG_HOME=$(mktemp -d) PYTHONFAULTHANDLER=1
          python skills/task-loop/dash/server.py --port 50001 --bind 127.0.0.1,203.0.113.9 &
          pid=$!
          sleep 20
          kill -0 $pid && { echo "STILL RUNNING after 20s"; ps -o pid,ppid,stat,command -ax | grep -E "lsof|server.py" | grep -v grep; kill -ABRT $pid; sleep 2; } || echo "exited early"
          wait $pid || echo "rc=$?"
